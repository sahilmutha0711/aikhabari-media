<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:Mono;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
:root{--ink:#07080C;--ink2:#14161C;--cream:#FFFFFF;--acc:#00E5FF;--red:#FF3D6E;--dim:#A3A7B5}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:Sans;color:var(--cream)}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.abs{position:absolute}
.disp{font-family:Disp;line-height:1.0;letter-spacing:0;text-transform:uppercase}
.ser{font-family:Ser;line-height:1.05}
.mono{font-family:Mono}
#grain{position:absolute;inset:-50px;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#brand{position:absolute;left:64px;top:92px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:4px}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--acc)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Sans;font-weight:700;font-size:64px;line-height:1.15}
#cap span{padding:2px 12px;border-radius:10px;margin:0 2px;display:inline-block}
.win{border-radius:24px;background:#1A1A1A;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.07)}
.bar{height:70px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:2px solid rgba(255,255,255,.07)}
.dot{width:18px;height:18px;border-radius:50%}
.chip{display:inline-block;padding:14px 32px;border-radius:60px;font-family:Mono;font-weight:700;font-size:32px;letter-spacing:2px}
.tag{font-family:Mono;font-size:20px;letter-spacing:3px;color:var(--dim);border:1px solid #444;padding:4px 10px;border-radius:6px}
</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__OWLDIR__/closeup.png"><img src="__OWLDIR__/point.png"><img src="__DIR__/stage.jpg"><img src="__DIR__/arm2_cut.png"></div>
<div id="cam"><div id="stage"></div></div>
<svg id="grain" width="1180" height="2020"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig"></div><div id="prog"></div><div id="brand"></div><div id="cap"></div><div id="logo"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__',K='__OWLDIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const L=[];WD.forEach(w=>{if(L[w.line]===undefined)L[w.line]=w.s});L.push(TOTAL);
function W(word,line,k=0){const c=WD.filter(w=>w.line===line&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:L[line]}
const P=(t,t0,d=.35)=>eo((t-t0)/d), B=(t,t0,d=.45)=>eb((t-t0)/d);
function typed(str,t,t0,cps=38){const n=Math.floor(cl((t-t0)*cps,0,str.length));return str.slice(0,n)+(t>t0&&n<str.length&&Math.floor(t*4)%2?'▍':'')}
function rise(t,t0,dy=60){const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`}
function pop(t,t0){const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`}
const PAL={sun:['#FF4D2E','#FF2E63','#FF9500','#FF6F91'],sea:['#0047E0','#00D4FF','#0020A0','#00F0C0'],neon:['#07080C','rgba(0,229,255,.38)','rgba(255,61,110,.38)','rgba(0,87,255,.35)'],alert:['#D10028','#FF3D6E','#FF6A00','#8A0018']};
function MESH(t,k){const c=PAL[k],a=t*.35;const g=(i,x,y,r)=>`radial-gradient(${r}px ${r}px at ${x}% ${y}%,${c[i]},transparent 70%)`;
 return `<div class=abs style="inset:0;background:${g(1,30+20*Math.sin(a),25+15*Math.cos(a*1.3),900)},${g(2,75+15*Math.cos(a*.9),70+15*Math.sin(a*1.1),1000)},${g(3,50+30*Math.sin(a*.7+2),95+10*Math.cos(a),800)},${c[0]}"></div>`}
const DUO=(o=.85,a='#FF3D6E',b='#FF8A00')=>`<div class=abs style="inset:0;background:linear-gradient(160deg,${a},${b});mix-blend-mode:color;opacity:${o}"></div>`;
const pad=n=>String(n).padStart(2,'0');
function stamp(t,d){const s=Math.floor(t*10)%600;return `${d} 0${Math.floor(9+t/60)}:${pad(14+Math.floor(t/60))}:${pad(Math.floor(t)%60)}`}

const fmt=n=>Math.round(n).toLocaleString('en-US');
const BOX=(s,bg='#fff',fg='#07080C')=>`<span style="background:${bg};color:${fg};padding:0 18px">${s}</span>`;
const S=[];
// 0 HOOK
S[0]=(t)=>{const m=W('million',0),c=fmt(138e6*eo(cl((t-0.5)/(m+.3-0.5))));let r='';
 for(let i=0;i<9;i++){const ph=(t*.9+i*.29)%1;r+=`<div class="abs mono" style="left:${60+(i*317)%860}px;top:${1700-ph*1500}px;font-size:26px;font-weight:700;background:rgba(120,0,30,.22);color:#fff;border-radius:12px;padding:6px 14px;opacity:${Math.sin(ph*Math.PI)*.55};rotate:${(i%3-1)*6}deg">PAID $0.0${i+1}</div>`}
 return `${MESH(t,'sun')}${r}
 <div class="abs disp" style="left:0;right:0;top:220px;text-align:center;font-size:300px;color:#fff;text-shadow:0 14px 60px rgba(120,0,30,.45);${pop(t,0)}">AI BOTS</div>
 <div class="abs disp" style="left:0;right:0;top:540px;text-align:center;font-size:130px;${rise(t,W('shopping',0))}">${BOX('went shopping','#07080C','#fff')}</div>
 <div class="abs disp" style="left:0;right:0;top:760px;text-align:center;font-size:200px;color:#fff;opacity:${P(t,W('hundred',0)-.2)}">${c}</div>
 <div class="abs disp" style="left:0;right:0;top:990px;text-align:center;font-size:90px;color:#07080C;opacity:${P(t,W('purchases...',0)-.1)}">purchases</div>
 <div class=abs style="left:0;right:0;top:1170px;text-align:center;${pop(t,W('pressed',0))}"><span class=disp style="display:inline-block;rotate:-5deg;font-size:96px;background:#fff;color:#D10028;border:8px solid #D10028;padding:6px 30px">No human pressed buy</span></div>`};
// 1 HOST
S[1]=(t)=>`${MESH(t,'sea')}
 <div class=abs style="left:290px;top:${330+Math.sin(t*3)*10}px;width:500px;height:500px;background:url(${K}/closeup.png) center/contain no-repeat;${pop(t,L[1])}"></div>
 <div class="abs ser" style="left:0;right:0;top:880px;text-align:center;font-size:80px;color:#fff;${rise(t,L[1]+.1)}">psst...</div>
 <div class="abs disp" style="left:0;right:0;top:990px;text-align:center;font-size:150px;color:#fff;${rise(t,L[1]+.35)}">The AI Khabari</div>`;
// 2 REPORT + Coinbase CEO photo
S[2]=(t)=>{const cb=W('Coinbase',2);return `<div class=abs style="inset:-40px;background:url(${D}/stage.jpg) center/cover;filter:grayscale(1) blur(6px) brightness(.55);transform:scale(${1.1+t*.004})"></div>${DUO(.95,'#0047E0','#00B8FF')}
 <div class="abs chip" style="left:64px;top:200px;background:#fff;color:#0047E0;${pop(t,W('Chainalysis',2))}">NEW CHAINALYSIS REPORT</div>
 <div class="abs disp" style="left:0;right:0;top:250px;text-align:center;font-size:330px;color:#fff;text-shadow:0 10px 60px rgba(0,0,60,.5);${pop(t,W('hundred',2)-.1)}">138M</div>
 <div class=abs style="left:110px;top:${790-eo((t-L[2])/.6)*30}px;width:860px;height:680px;background:url(${D}/arm2_cut.png) center bottom/contain no-repeat;opacity:${P(t,cb-.4,.4)}"></div>
 <div class="abs disp" style="left:0;right:0;top:600px;text-align:center;font-size:84px;color:#fff;${rise(t,W('payments,',2))}">AI agent ${BOX('payments','#fff','#0047E0')}</div>
 <div class="abs" style="left:64px;right:64px;top:1300px;text-align:center;${rise(t,cb)}"><span class=disp style="font-size:100px;background:#07080C;color:#fff;padding:4px 28px">Coinbase's <span style="color:#00F0C0">x402</span></span></div>
 <div class="abs mono" style="left:64px;right:64px;top:1465px;text-align:center;font-size:22px;color:#DDEBFF;opacity:${P(t,cb)}">Coinbase CEO Brian Armstrong. Photo: TechCrunch / CC BY 2.0</div>`};
// 3 HOW — agent log window (illustration)
S[3]=(t)=>{const it=[['NO CARD','card.'],['NO CHECKOUT','checkout.'],['NO HUMAN','human']];
 const lines=['> agent: need weather data','> 402 payment required','> paying 0.03 USDC ...','> paid. data received'];let lg='';
 lines.forEach((x,i)=>{const t0=L[3]+.1+i*.55;lg+=`<div style="color:${i==3?'#00F0C0':'#EDEDED'};opacity:${P(t,t0,.2)}">${typed(x,t,t0,40)}</div>`});
 let b='';it.forEach((x,i)=>{b+=`<div class=disp style="font-size:150px;line-height:1.02;${pop(t,W(x[1],3))}">${i==2?BOX(x[0],'#FF3D6E','#fff'):x[0]}</div>`});
 return `${MESH(t,'neon')}
 <div class="abs win" style="left:54px;right:54px;top:200px;${rise(t,L[3])}"><div class=bar><div class=dot style="background:#FF5F57"></div><div class=dot style="background:#FEBC2E"></div><div class=dot style="background:#28C840"></div><div class=mono style="margin-left:16px;font-size:24px;color:var(--dim)">ai-agent</div><div class=tag style="margin-left:auto">ILLUSTRATION</div></div>
 <div class=mono style="padding:30px 36px;font-size:44px;line-height:1.55;height:360px">${lg}</div></div>
 <div class=abs style="left:64px;right:64px;top:780px">${b}</div>`};
// 4 CART
S[4]=(t)=>{const it=[['DATA','Data.','$0.01'],['SEARCH RESULTS','Search','$0.02'],['CODE REVIEWS','Code','$0.05'],['TIME ON OTHER AIs','time','$0.08']];
 let h=`${MESH(t,'sun')}<div class="abs disp" style="left:64px;top:210px;font-size:120px;color:#fff;${rise(t,L[4])}">What are bots ${BOX('buying?','#07080C','#fff')}</div>`;
 it.forEach((x,i)=>{const t0=W(x[1],4);h+=`<div class=abs style="left:64px;right:64px;top:${520+i*140}px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:22px;padding:18px 30px;color:#07080C;${rise(t,t0-.1,40)}"><span class=disp style="font-size:84px">${x[0]}</span><span class=mono style="font-size:40px;font-weight:700;color:#FF2E63">${x[2]}</span></div>`});
 const p=W('paying',4);
 h+=`<div class="abs disp" style="left:0;right:0;top:1120px;text-align:center;font-size:170px;color:#fff;${pop(t,p-.25)}">AI is ${BOX('paying','#07080C','#FFD84D')} AI</div>`;return h};
// 5 NUMBERS
S[5]=(t)=>{const e=W('eighteen',5),s=W('Seventy-three',5),fill=eo(cl((t-s)/.9));
 return `${MESH(t,'sea')}
 <div class="abs mono" style="left:64px;top:220px;font-size:32px;font-weight:700;letter-spacing:4px;${rise(t,L[5])}">MOST PAYMENTS</div>
 <div class="abs disp" style="left:64px;top:270px;font-size:200px;color:#fff;${pop(t,W('under',5))}">under ${BOX('10&cent;','#fff','#0047E0')}</div>
 <div class="abs mono" style="left:64px;top:620px;font-size:32px;font-weight:700;letter-spacing:3px;${rise(t,W('wallets',5))}">NEW BOT WALLET &rarr; FIRST PURCHASE</div>
 <div class=abs style="left:64px;right:64px;top:690px;opacity:${P(t,s-.5)}"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class=disp style="font-size:70px">Late last year</span><b class=disp style="font-size:120px">73 days</b></div><div style="height:80px;border-radius:14px;background:rgba(255,255,255,.9);width:${4+96*fill}%;margin-top:8px"></div></div>
 <div class=abs style="left:64px;right:64px;top:${e<s?960:960}px;opacity:${P(t,e)}"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class=disp style="font-size:70px">Now</span><b class=disp style="font-size:160px;color:#00F0C0">18 min</b></div><div style="height:80px;border-radius:14px;background:#00F0C0;width:4%;margin-top:8px"></div></div>`};
// 6 CATCH
S[6]=(t)=>{const it=[['a lot may be test scripts, not real demand','scripts,'],['one estimate: only ~$50M total','estimate']];
 let h=`${MESH(t,'alert')}<div class="abs disp" style="left:64px;top:260px;font-size:220px;color:#fff;${pop(t,L[6])}">The catch</div>`;
 it.forEach((x,i)=>{const t0=W(x[1],6);h+=`<div class="abs mono" style="left:64px;right:64px;top:${620+i*240}px;font-size:50px;line-height:1.3;padding:30px 34px;border-radius:18px;background:rgba(0,0,0,.3);border:3px solid #fff;opacity:${P(t,t0-.3,.25)}"><b>[!]</b> ${typed(x[0],t,t0-.3,45)}</div>`});return h};
// 7 TAKE
S[7]=(t)=>`${MESH(t,'neon')}
 <div class="abs mono" style="left:64px;top:260px;font-size:32px;letter-spacing:5px;font-weight:700;color:var(--acc);${rise(t,L[7])}">OUR TAKE</div>
 <div class="abs disp" style="left:64px;right:64px;top:320px;font-size:170px;${rise(t,W('next',7))}">The internet's next big ${BOX('customer','#00E5FF','#07080C')}</div>
 <div class="abs ser" style="left:64px;right:64px;top:930px;font-size:130px;color:#FF6F91;${pop(t,W('person.',7))}">might not be a person.</div>`;
// 8 TAKEAWAY (light)
S[8]=(t)=>{const t0=W('limit',8),c=P(t,t0,.25);return `<div class=abs style="inset:0;background:linear-gradient(160deg,#F2FEFF,#B8F1FF 60%,#9FE6FF)"></div>
 <div class="abs mono" style="left:64px;top:300px;font-size:30px;letter-spacing:5px;font-weight:700;color:#0047E0;${rise(t,L[8])}">WHAT YOU CAN TAKE FROM THIS</div>
 <div class="abs disp" style="left:64px;right:64px;top:380px;font-size:120px;color:#07080C;${rise(t,W('give',8))}">Giving an AI agent your money?</div>
 <div class=abs style="left:64px;right:64px;top:760px;display:flex;align-items:center;gap:34px;color:#07080C;${rise(t,t0-.5,40)}"><div style="flex:none;width:120px;height:120px;border-radius:24px;border:6px solid #07080C;background:${c>.5?'#00E5FF':'transparent'};display:flex;align-items:center;justify-content:center">${c>.5?'<svg width=76 height=76 viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill=none stroke="#111" stroke-width=3.4 stroke-linecap=round stroke-linejoin=round/></svg>':''}</div><div class=disp style="font-size:96px;line-height:1.1">Set a hard ${BOX('spending limit','#0047E0','#fff')} first</div></div>`};
// 9 CTA
S[9]=(t)=>`${MESH(t,'neon')}
 <div class="abs disp" style="left:64px;right:64px;top:280px;font-size:160px;${rise(t,L[9])}">Would you let an AI</div>
 <div class="abs ser" style="left:64px;right:64px;top:620px;font-size:140px;color:var(--acc);${rise(t,W('shop',9))}">shop for you?</div>
 <div class="abs chip" style="left:64px;top:860px;background:var(--acc);color:var(--ink);${pop(t,W('send',9))}">SEND TO A FRIEND</div>
 <div class="abs chip" style="left:64px;top:980px;border:3px solid var(--cream);${pop(t,W('guest.',9)-.4)}">FOLLOW @THEAIKHABARI</div>
 <div class=abs style="right:30px;top:${1040+Math.sin(t*3)*12}px;width:420px;height:420px;background:url(${K}/point.png) center/contain no-repeat;transform:scaleX(-1);opacity:${P(t,L[9]+.3,.4)}"></div>
 <div class="abs mono" style="left:64px;right:64px;top:1800px;font-size:20px;color:var(--dim)">Sources: Chainalysis via The Daily Hodl, Fortune, Cryptopolitan (TRM Labs estimate). Agent log is an illustration. Voice: ElevenLabs.</div>`;
const LIGHT=new Set([8]);
function setT(t){
 let i=0;for(let k=0;k<S.length;k++)if(t>=L[k]-.12)i=k;
 const lt=t-(L[i]-.12),inP=eo(lt/.28);
 document.getElementById('stage').innerHTML=`<div class=abs style="inset:0;transform:translateX(${(1-inP)*140}px);filter:blur(${(1-inP)*14}px)">${S[i](t,lt)}</div>`;
 const beats=[W('pressed',0),W('paying',4),W('person.',7)];let pz=0;beats.forEach(b=>{if(t>b&&t<b+.5)pz=Math.max(pz,(1-(t-b)/.5)*.05)});
 document.getElementById('cam').style.transform=`scale(${1+pz+Math.sin(t*.7)*.004}) rotate(${pz*8*Math.sin(t*40)}deg)`;
 
 const lg=document.getElementById('logo');lg.innerHTML=t<0.7?`<div class=abs style="left:390px;top:700px;width:300px;height:300px;background:url(${K}/closeup.png) center/contain no-repeat;opacity:${1-cl((t-.35)/.3)};transform:scale(${.3+.9*eb(t/.35)})"></div><div class=abs style="inset:0;background:#fff;opacity:${.5*(1-cl(t/.25))}"></div>`:'';
 document.getElementById('tb').setAttribute('seed',Math.floor(t*24)%97+1);
 document.getElementById('grain').style.transform=`translate(${(t*137)%40-20}px,${(t*91)%40-20}px)`;
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 const light=LIGHT.has(i),br=document.getElementById('brand');br.innerHTML=`<span style="color:${light?'#0047E0':'var(--acc)'}">&#9679;</span> THE AI KHABARI`;br.style.color=light?'var(--ink)':'var(--cream)';
 document.getElementById('prog').style.background=light?'#0047E0':'#fff';
 const cur=WD.findIndex(w=>t>=w.s&&t<w.e+.05);const cap=document.getElementById('cap');
 if(cur<0||t<0.05){cap.innerHTML='';return}
 const g=Math.floor(cur/3)*3,grp=WD.slice(g,g+3).filter(w=>w.line===WD[cur].line);
 cap.innerHTML=grp.map(w=>{const on=w===WD[cur];return `<span style="${on?(light?'background:#07080C;color:#fff':'background:#fff;color:#07080C')+';transform:scale(1.08)':'color:'+(light?'var(--ink)':'var(--cream)')+';text-shadow:'+(light?'none':'0 4px 18px rgba(0,0,0,.8)')}">${w.w.replace(/[{}]/g,'')}</span>`}).join(' ');
}
setT(0);
</script></body></html>
