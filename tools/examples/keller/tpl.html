<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:Mono;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
:root{--ink:#07080C;--cream:#FFFFFF;--acc:#00E5FF;--red:#FF3D6E;--dim:#C9CCD6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#FF3D9A}
body{width:1080px;height:1920px;overflow:hidden;font-family:Sans;color:var(--cream);position:relative}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.abs{position:absolute}
.disp{font-family:Disp;line-height:1.0;letter-spacing:0;text-transform:uppercase}
.ser{font-family:Ser;line-height:1.05}
.mono{font-family:Mono}
#grain{position:absolute;inset:-50px;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#brand{position:absolute;left:64px;top:92px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#prog{position:absolute;left:0;top:0;height:8px;background:#fff}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Sans;font-weight:700;font-size:64px;line-height:1.15}
#cap span{padding:2px 12px;border-radius:10px;margin:0 2px;display:inline-block}
.chip{display:inline-block;padding:14px 32px;border-radius:60px;font-family:Mono;font-weight:700;font-size:32px;letter-spacing:2px}
.tag{font-family:Mono;font-size:20px;letter-spacing:3px;color:#fff;border:1px solid rgba(255,255,255,.5);padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.25)}
.box{background:#fff;color:#07080C;padding:0 18px}
.fig{position:absolute;width:300px;height:380px}
.fig .h{position:absolute;left:85px;top:0;width:130px;height:150px;border-radius:65px 65px 60px 60px}
.fig .b{position:absolute;left:0;top:165px;width:300px;height:215px;border-radius:150px 150px 20px 20px}
</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__DIR__/keller_cut.png"><img src="__DIR__/chip.jpg"><img src="__DIR__/lg.jpg"><img src="__OWLDIR__/closeup.png"><img src="__OWLDIR__/point.png"></div>
<div id="cam"><div id="stage"></div></div>
<svg id="grain" width="1180" height="2020"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig" style="display:none"></div><div id="ov"></div><div id="prog"></div><div id="brand"></div><div id="cap"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const L=[];WD.forEach(w=>{if(L[w.line]===undefined)L[w.line]=w.s});L.push(TOTAL);
function W(word,line,k=0){const c=WD.filter(w=>w.line===line&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:L[line]}
const P=(t,t0,d=.35)=>eo((t-t0)/d), B=(t,t0,d=.45)=>eb((t-t0)/d);
function typed(str,t,t0,cps=38){const n=Math.floor(cl((t-t0)*cps,0,str.length));return str.slice(0,n)+(t>t0&&n<str.length&&Math.floor(t*4)%2?'▍':'')}
function rise(t,t0,dy=60){const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`}
function pop(t,t0){const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`}
const PAL={sun:['#FF4D2E','#FF2E63','#FF9500','#FF6F91'],sea:['#0047E0','#00D4FF','#0020A0','#00F0C0'],neon:['#07080C','rgba(0,229,255,.38)','rgba(255,61,110,.38)','rgba(0,87,255,.35)'],alert:['#D10028','#FF3D6E','#FF6A00','#8A0018']};
function MESH(t,k){const c=PAL[k],a=t*.35;const g=(i,x,y,r)=>`radial-gradient(${r}px ${r}px at ${x}% ${y}%,${c[i]},transparent 70%)`;
 return `<div class=abs style="inset:0;background:${g(1,30+20*Math.sin(a),25+15*Math.cos(a*1.3),900)},${g(2,75+15*Math.cos(a*.9),70+15*Math.sin(a*1.1),1000)},${g(3,50+30*Math.sin(a*.7+2),95+10*Math.cos(a),800)},${c[0]}"></div>`}
const DUO=(o=.85,a='#FF3D6E',b='#FF8A00')=>`<div class=abs style="inset:0;background:linear-gradient(160deg,${a},${b});mix-blend-mode:color;opacity:${o}"></div>`;
const BOX=(s,bg='#fff',fg='#07080C')=>`<span style="background:${bg};color:${fg};padding:0 18px">${s}</span>`;
// glitchy AI avatar silhouette
function AVA(t,x,y,s=1,col='#00E5FF'){const j=Math.sin(t*37)>0.85?((t*997)%14-7):0;let lines='';for(let i=0;i<24;i++){lines+=`<div style="position:absolute;left:0;right:0;top:${i*16}px;height:3px;background:rgba(255,255,255,.12)"></div>`}
 return `<div class=fig style="left:${x}px;top:${y}px;transform:scale(${s}) translateX(${j}px);filter:drop-shadow(0 0 30px ${col})"><div class=h style="background:${col};opacity:.9"></div><div class=b style="background:${col};opacity:.9"></div><div class=abs style="inset:0;overflow:hidden">${lines}</div><div class="abs mono" style="left:0;right:0;top:250px;text-align:center;font-size:44px;font-weight:700;color:#07080C">AI</div></div>`}
const K='__OWLDIR__';
const PK='#FF3D9A',CY='#00D4FF',I='#120014';
const FLAT=c=>`<div class=abs style="inset:0;background:${c}"></div>`;
const DOTS=(c,o=.12)=>`<div class=abs style="inset:0;background-image:radial-gradient(${c} 3px,transparent 3.5px);background-size:46px 46px;opacity:${o}"></div>`;
const CARD=(img,x,y,w,h,rot,t,t0,cap,pos='center')=>{const p=B(t,t0,.5);return `<div class=abs style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:#fff;padding:16px 16px 64px;border-radius:10px;box-shadow:14px 14px 0 ${I};transform:rotate(${rot}deg) translateY(${(1-p)*500}px);opacity:${cl((t-t0)/.15)}"><div style="width:100%;height:100%;background:url(${D}/${img}) ${pos}/cover;border-radius:4px"></div><div class=mono style="position:absolute;left:18px;right:18px;bottom:16px;font-size:20px;color:#333">${cap}</div></div>`};
const TAG=(s,bg,fg,t,t0,x,y,rot=0,fs=74)=>`<div class="abs disp" style="left:${x}px;top:${y}px;font-size:${fs}px;background:${bg};color:${fg};padding:4px 22px;border:5px solid ${I};box-shadow:8px 8px 0 ${I};transform:rotate(${rot}deg) scale(${t<t0?0:.6+.4*B(t,t0,.4)});opacity:${t<t0?0:1}">${s}</div>`;
const S=[];
S[0]=(t)=>{const b=W('billion',0),nv=W('nvidia.',0);return `${FLAT(PK)}${DOTS(I,.10)}
 <div class=abs style="left:300px;top:${520+Math.sin(t*1.3)*6}px;width:820px;height:1100px;background:url(${D}/keller_cut.png) center top/contain no-repeat"></div>
 <div class="abs disp" style="left:60px;right:60px;top:170px;font-size:104px;color:#fff;-webkit-text-stroke:3px ${I};text-shadow:8px 8px 0 ${I}">He designed chips for</div>
 ${TAG('APPLE','#fff',I,t,-1,60,330,-3,96)}${TAG('AMD',CY,I,t,-1,370,330,2,96)}${TAG('TESLA','#fff',I,t,-1,610,330,-2,96)}
 <div class=abs style="left:40px;top:640px;transform:rotate(-6deg);${pop(t,b-.4)}"><div class=disp style="font-size:230px;line-height:.9;color:#fff;-webkit-text-stroke:7px ${I};text-shadow:14px 14px 0 ${CY}">$1.5B</div></div>
 <div class="abs disp" style="left:50px;top:900px;font-size:96px;line-height:1.05;${pop(t,nv-.45)}">${BOX('to go after',I,'#fff')}<br>${BOX('Nvidia',CY,I)}</div>
 <div class="abs mono" style="left:60px;top:1440px;font-size:18px;color:#3a0020">Photo: Jim Keller · LG Electronics / CC BY 2.0</div>`};
S[1]=(t)=>{const v=W('$6.2',1),dbl=W('double',1);const x=6.2*eo(cl((t-v+.2)/.7));const bh=p=>p*470;return `${FLAT('#fff')}${DOTS(I,.06)}
 <div class="abs mono" style="left:60px;top:190px;font-size:34px;font-weight:700;letter-spacing:4px;color:${I};${rise(t,L[1])}">HIS NAME IS</div>
 <div class="abs disp" style="left:60px;right:60px;top:240px;font-size:170px;color:${I};${pop(t,W('jim',1)-.1)}">Jim Keller</div>
 <div class="abs disp" style="left:60px;right:60px;top:430px;font-size:110px;color:${I};${rise(t,W('startup,',1))}"><span class=mono style="font-size:34px;font-weight:700;letter-spacing:3px;vertical-align:middle">HIS STARTUP </span>${BOX('Tenstorrent',PK,'#fff')}</div>
 <div class="abs mono" style="left:60px;top:600px;font-size:34px;font-weight:700;letter-spacing:3px;color:${I};${rise(t,v-.4)}">NOW WORTH</div>
 <div class="abs disp" style="left:60px;top:630px;font-size:250px;color:${I};text-shadow:12px 12px 0 ${CY};opacity:${P(t,v-.3)}">$${x.toFixed(1)}B</div>
 <div class=abs style="left:200px;top:${1400-bh(2.6/6.2)}px;width:240px;height:${bh(2.6/6.2)}px;background:${CY};border:6px solid ${I};opacity:${P(t,dbl-.5)}"></div>
 <div class=abs style="left:560px;top:${1400-bh(6.2/6.2*P(t,dbl-.3,.6))}px;width:240px;height:${bh(P(t,dbl-.3,.6))}px;background:${PK};border:6px solid ${I};opacity:${P(t,dbl-.3,.1)}"></div>
 <div class="abs mono" style="left:200px;width:240px;top:1410px;text-align:center;font-size:28px;font-weight:700;opacity:${P(t,dbl-.5)}">2024: $2.6B</div>
 <div class="abs mono" style="left:560px;width:240px;top:1410px;text-align:center;font-size:28px;font-weight:700;opacity:${P(t,dbl-.3)}">NOW: $6.2B</div>`};
S[2]=(t)=>{const no=W('instead.',2)-.5;const rs=W('raised',2);return `${FLAT(CY)}${DOTS(I,.10)}
 <div class="abs mono" style="left:60px;top:200px;font-size:34px;font-weight:700;letter-spacing:4px;color:${I};${rise(t,L[2])}">THE CRAZY PART</div>
 <div class="abs disp" style="left:60px;right:60px;top:260px;font-size:140px;color:${I};${rise(t,W('intel',2)-.1)}">${BOX('Intel','#fff',I)} &amp; ${BOX('Qualcomm','#fff',I)}</div>
 <div class="abs ser" style="left:60px;right:60px;top:560px;font-size:84px;color:${I};${rise(t,W('held',2))}">held talks to buy it this year.</div>
 <div class=abs style="left:60px;top:860px;display:flex;gap:40px">
  <div style="width:440px;height:300px;background:#fff;border:6px solid ${I};box-shadow:10px 10px 0 ${I};border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;${pop(t,rs-.3)}"><div class=disp style="font-size:110px;color:#999;text-decoration:line-through;text-decoration-color:${PK};text-decoration-thickness:12px">SELL</div></div>
  <div style="width:440px;height:300px;background:${PK};border:6px solid ${I};box-shadow:10px 10px 0 ${I};border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;${pop(t,rs)}"><div class=disp style="font-size:110px;color:#fff">RAISE</div><div class=mono style="font-size:30px;font-weight:700;color:#fff">$1.5B SERIES E</div></div></div>`};
S[3]=(t)=>{const rv=W('risc-v,',3),bp=W('blueprint',3),os=W('open-sources',3),sm=W('samsung',3);const late=t>sm-.4;return `${FLAT(PK)}${DOTS(I,.10)}
 <div class="abs disp" style="left:60px;top:190px;font-size:200px;color:#fff;-webkit-text-stroke:5px ${I};text-shadow:12px 12px 0 ${I};${pop(t,L[3])}">Open chips</div>
 ${late?'':CARD('chip.jpg',560,470,440,520,4,t,rv-.4,'RISC-V test chip · CC0','center')}
 <div class=abs style="left:60px;width:${late?960:470}px;top:480px;display:flex;flex-direction:column;gap:26px">
  <div class="disp" style="font-size:66px;background:#fff;color:${I};border:5px solid ${I};box-shadow:8px 8px 0 ${I};padding:14px 22px;${pop(t,rv-.2)}">RISC-V = a free chip blueprint</div>
  <div class="disp" style="font-size:66px;background:${CY};color:${I};border:5px solid ${I};box-shadow:8px 8px 0 ${I};padding:14px 22px;${pop(t,os-.2)}">Open-source software</div></div>
 ${late?CARD('lg.jpg',90,860,900,560,-2,t,sm-.4,'LG Electronics CEO + Jim Keller · CC BY 2.0','center 30%'):''}
 <div class="abs chip" style="left:120px;top:800px;background:${I};color:#fff;font-size:38px;${pop(t,W('license',3)-.2)}">SAMSUNG + LG LICENSE ITS DESIGNS</div>`};
S[4]=(t)=>`${FLAT(I)}
 <div class="abs disp" style="left:60px;top:220px;font-size:210px;color:${PK};${pop(t,L[4])}">The catch</div>
 <div class="abs mono" style="left:60px;right:60px;top:520px;font-size:60px;line-height:1.3;padding:30px 34px;border-radius:18px;background:#fff;color:${I};border:5px solid ${CY};box-shadow:10px 10px 0 ${CY};opacity:${P(t,W('no',4)-.1,.25)}"><b>[!]</b> ${typed('No big server customer named yet.',t,W('no',4)-.1,24)}</div>`;
S[5]=(t)=>{const kl=W('keller',5);return `${FLAT(CY)}${DOTS(I,.10)}
 <div class="abs chip" style="left:60px;top:220px;background:${I};color:#fff;${pop(t,L[5])}">SAY THIS AT WORK</div>
 <div class="abs disp" style="left:60px;right:60px;top:360px;font-size:150px;color:${I};${rise(t,W('nvidia',5)-.1)}">Nvidia sells ${BOX('the chips','#fff',I)}</div>
 <div class="abs disp" style="left:60px;right:60px;top:720px;font-size:150px;color:${I};${pop(t,kl-.2)}">Keller also sells ${BOX('the recipe',PK,'#fff')}</div>`};
S[6]=(t)=>`${FLAT(PK)}${DOTS(I,.10)}
 <div class=abs style="left:60px;right:60px;top:240px;border-radius:34px;background:#fff;color:${I};border:6px solid ${I};box-shadow:12px 12px 0 ${I};padding:30px 36px;display:flex;align-items:center;gap:28px;${pop(t,L[6])}">
  <svg width=90 height=90 viewBox="0 0 24 24" style="flex:none"><path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z" fill="${PK}"/></svg>
  <div><div class=mono style="font-size:26px;font-weight:700;color:${PK};letter-spacing:2px">SEND THIS TO</div><div class=disp style="font-size:68px">the friend who says Nvidia has no competition</div></div></div>
 <div class="abs chip" style="left:60px;top:720px;background:${I};color:#fff;${pop(t,W('competition.',6)-.6)}">FOLLOW @THEAIKHABARI</div>
 <div class=abs style="right:30px;top:${900+Math.sin(t*3)*12}px;width:460px;height:460px;background:url(${K}/point.png) center/contain no-repeat;transform:scaleX(-1);opacity:${P(t,L[6]+.3,.4)}"></div>
 <div class="abs mono" style="left:60px;right:60px;top:1800px;font-size:19px;color:#3a0020">Sources: The Next Web, DCD, Globe and Mail (Oct 19). Voice: ElevenLabs.</div>`;
const LIGHT=new Set([1,2,5]);
function setT(t){
 let i=0;for(let k=0;k<S.length;k++)if(t>=L[k]-.12)i=k;
 const lt=t-(L[i]-.12),inP=eo(lt/.28);
 document.getElementById('stage').innerHTML=`<div class=abs style="inset:0;transform:translateX(${(1-inP)*140}px);filter:blur(${(1-inP)*14}px)">${S[i](t,lt)}</div>`;
 document.getElementById('ov').innerHTML='';
 const beats=[W('nvidia.',0),W('$6.2',1),W('recipe.',5)];let pz=0;beats.forEach(b=>{if(t>b&&t<b+.5)pz=Math.max(pz,(1-(t-b)/.5)*.05)});
 document.getElementById('cam').style.transform=`scale(${1+pz+Math.sin(t*.7)*.004}) rotate(${pz*8*Math.sin(t*40)}deg)`;
 document.getElementById('tb').setAttribute('seed',Math.floor(t*24)%97+1);
 document.getElementById('grain').style.transform=`translate(${(t*137)%40-20}px,${(t*91)%40-20}px)`;
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 const light=LIGHT.has(i),br=document.getElementById('brand');br.innerHTML=`<span style="color:${light?'#120014':'#00D4FF'}">&#9679;</span> THE AI KHABARI`;br.style.color=light?'#07080C':'#fff';
 document.getElementById('prog').style.background=light?'#120014':'#fff';
 const cur=WD.findIndex(w=>t>=w.s&&t<w.e+.05);const cap=document.getElementById('cap');
 if(cur<0){cap.innerHTML='';return}
 const g=Math.floor(cur/3)*3,grp=WD.slice(g,g+3).filter(w=>w.line===WD[cur].line);
 cap.innerHTML=grp.map(w=>{const on=w===WD[cur];return `<span style="${on?(light?'background:#07080C;color:#fff':'background:#fff;color:#07080C')+';transform:scale(1.08)':'color:'+(light?'#07080C':'#fff')+';text-shadow:'+(light?'none':'0 4px 18px rgba(0,0,0,.8)')}">${w.w}</span>`}).join(' ');
}
setT(0);
</script></body></html>
