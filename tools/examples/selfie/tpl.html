</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__DIR__/courtroom.jpg"><img src="__DIR__/bench.jpg"><img src="__DIR__/maricopa.jpg"></div>
<div id="cam"><div id="stage"></div></div>
<svg id="grain" width="1180" height="2020"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig"></div><div id="ov"></div><div id="prog"></div><div id="brand"></div><div id="cap"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const L=[];WD.forEach(w=>{if(L[w.line]===undefined)L[w.line]=w.s});L.push(TOTAL);
function W(word,line,k=0){const c=WD.filter(w=>w.line===line&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:L[line]}
const P=(t,t0,d=.35)=>eo((t-t0)/d), B=(t,t0,d=.45)=>eb((t-t0)/d);
function typed(str,t,t0,cps=38){const n=Math.floor(cl((t-t0)*cps,0,str.length));return str.slice(0,n)+(t>t0&&n<str.length&&Math.floor(t*4)%2?'▍':'')}
function rise(t,t0,dy=60){const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`}
function pop(t,t0){const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`}
const PAL={sun:['#FF4D2E','#FF2E63','#FF9500','#FF6F91'],sea:['#0047E0','#00D4FF','#0020A0','#00F0C0'],neon:['#07080C','rgba(0,229,255,.38)','rgba(255,61,110,.38)','rgba(0,87,255,.35)'],alert:['#D10028','#FF3D6E','#FF6A00','#8A0018']};
function MESH(t,k){const c=PAL[k],a=t*.35;const g=(i,x,y,r)=>`radial-gradient(${r}px ${r}px at ${x}% ${y}%,${c[i]},transparent 70%)`;
 return `<div class=abs style="inset:0;background:${g(1,30+20*Math.sin(a),25+15*Math.cos(a*1.3),900)},${g(2,75+15*Math.cos(a*.9),70+15*Math.sin(a*1.1),1000)},${g(3,50+30*Math.sin(a*.7+2),95+10*Math.cos(a),800)},${c[0]}"></div>`}
const DUO=(o=.85,a='#FF3D6E',b='#FF8A00')=>`<div class=abs style="inset:0;background:linear-gradient(160deg,${a},${b});mix-blend-mode:color;opacity:${o}"></div>`;
const BOX=(s,bg='#fff',fg='#07080C')=>`<span style="background:${bg};color:${fg};padding:0 18px">${s}</span>`;
// glitchy AI avatar silhouette
function AVA(t,x,y,s=1,col='#00E5FF'){const j=Math.sin(t*37)>0.85?((t*997)%14-7):0;let lines='';for(let i=0;i<24;i++){lines+=`<div style="position:absolute;left:0;right:0;top:${i*16}px;height:3px;background:rgba(255,255,255,.12)"></div>`}
 return `<div class=fig style="left:${x}px;top:${y}px;transform:scale(${s}) translateX(${j}px);filter:drop-shadow(0 0 30px ${col})"><div class=h style="background:${col};opacity:.9"></div><div class=b style="background:${col};opacity:.9"></div><div class=abs style="inset:0;overflow:hidden">${lines}</div><div class="abs mono" style="left:0;right:0;top:250px;text-align:center;font-size:44px;font-weight:700;color:#07080C">AI</div></div>`}
const AROLL=[[0,L[1]],[L[5],L[6]],[L[8],L[9]],[L[11],W('AI',11)+0.2],[L[13],TOTAL]];
const isA=t=>AROLL.some(([a,b])=>t>=a-.05&&t<b-.05);
const S=[];
// 0 HOOK (A-roll overlay)
S[0]=(t)=>`<div class=abs style="left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(7,8,12,.75),transparent)"></div>
 <div class="abs disp" style="left:50px;right:50px;top:170px;text-align:center;font-size:118px;text-shadow:0 8px 40px rgba(0,0,0,.6);${pop(t,0)}">AI made a dead man</div>
 <div class="abs disp" style="left:0;right:0;top:300px;text-align:center;font-size:118px;${pop(t,0.15)}">${BOX('talk in court','#FF3D6E','#fff')}</div>`;
// 1 courtroom
S[1]=(t)=>`<div class=abs style="inset:-40px;background:url(${D}/courtroom.jpg) center/cover;filter:grayscale(1) contrast(1.15) brightness(.55);transform:scale(${1.12+(t-L[1])*.03})"></div>${DUO(.9,'#0047E0','#00B8FF')}
 <div class=abs style="inset:0;background:linear-gradient(180deg,rgba(0,20,80,.2),rgba(0,10,40,.75))"></div>
 ${AVA(t,390,560,1.25)}

 <div class="abs disp" style="left:0;right:0;top:1210px;font-size:150px;text-align:center;${pop(t,W('courtroom?',1)-.2)}">${BOX('judge','#fff','#0047E0')}</div>
 <div class="abs tag" style="right:64px;top:180px">REPRESENTATIVE COURTROOM</div>`;
// 2 the case
S[2]=(t)=>{const it=[['Shot &amp; killed','killed'],['Road rage','road'],['Chandler, Arizona · 2021','Arizona,']];let h='';
 it.forEach((x,i)=>{const t0=W(x[1],2);h+=`<div class=abs style="left:64px;top:${860+i*130}px;${rise(t,t0-.1,40)}"><span class=disp style="font-size:84px;background:${i==0?'#fff':'rgba(7,8,12,.75)'};color:${i==0?'#D10028':'#fff'};padding:4px 22px">${x[0]}</span></div>`});
 return `<div class=abs style="inset:-40px;background:url(${D}/maricopa.jpg) center 30%/cover;filter:grayscale(1) contrast(1.2) brightness(.6);transform:scale(${1.1+(t-L[2])*.02})"></div>${DUO(.92)}
 <div class=abs style="inset:0;background:linear-gradient(180deg,rgba(80,0,20,.1),rgba(60,0,10,.7))"></div>
 <div class="abs chip" style="left:64px;top:200px;background:#fff;color:#D10028;${pop(t,L[2])}">THE CASE</div>
 <div class="abs disp" style="left:64px;right:64px;top:320px;font-size:210px;${pop(t,W('Chris',2))}">Chris</div>
 <div class="abs disp" style="left:64px;right:64px;top:520px;font-size:210px;${pop(t,W('Pelkey,',2))}">Pelkey</div>
 ${h}
 <div class="abs mono" style="left:64px;right:64px;top:1440px;font-size:20px;color:#FFE3EA">Photo: Maricopa County Superior Court, Phoenix · Zeb Micelli / CC0</div>`};
// 3 sister builds AI
S[3]=(t)=>{const sis=W('sister',3),cr=W('created',3),av=W('avatar',3);const cards=[['PHOTOS',0],['VOICE',1],['SCRIPT',2]];let c='';
 cards.forEach(([n,i])=>{const t0=sis+.25+i*.35,m=P(t,cr,.8);c+=`<div class=abs style="left:${80+i*320}px;top:${560+m*(i-1)*-10}px;width:280px;height:280px;border-radius:26px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;transform:translateX(${m*(1-i)*300}px) scale(${1-m*.6});opacity:${P(t,t0,.3)*(1-cl((t-cr-.6)/.3))}">
  ${i==0?`<div style="width:150px;height:150px;border-radius:12px;background:linear-gradient(160deg,#FF6F91,#FF9500)"></div>`:i==1?`<svg width=200 height=120 viewBox="0 0 200 120">${[...Array(20)].map((_,k)=>{const hh=20+Math.abs(Math.sin(k*1.7+t*8))*80;return `<rect x=${k*10} y=${60-hh/2} width=6 height=${hh} rx=3 fill="#00E5FF"/>`}).join('')}</svg>`:`<div style="width:150px">${[0,1,2,3,4].map(k=>`<div style="height:12px;border-radius:6px;background:#fff;opacity:.8;margin:14px 0;width:${100-k*12}%"></div>`).join('')}</div>`}
  <div class="abs mono" style="bottom:-56px;left:0;right:0;text-align:center;font-size:28px;font-weight:700">${n}</div></div>`});
 return `${MESH(t,'neon')}
 
 ${t<sis?`<div class="abs disp" style="left:64px;right:64px;top:330px;font-size:150px;${pop(t,W('sentencing',3))}">At the ${BOX('sentencing','#fff','#07080C')}</div><div class="abs disp" style="left:64px;right:64px;top:700px;font-size:110px;color:#00E5FF;${rise(t,W('shooter,',3))}">of his shooter</div>`:''}
 <div class="abs disp" style="left:64px;right:64px;top:310px;font-size:110px;${rise(t,sis)}">His sister built ${BOX('an AI of him','#00E5FF','#07080C')}</div>
 ${c}
 <div style="opacity:${P(t,av-.3,.4)}">${AVA(t,390,620,1.3)}</div>
 <div class="abs tag" style="right:64px;top:206px">ILLUSTRATION</div>`};
// 4 the AI's words
S[4]=(t)=>{const b=W('believe',4);return `<div class=abs style="inset:-40px;background:url(${D}/bench.jpg) center/cover;filter:grayscale(1) blur(5px) brightness(.4);transform:scale(1.15)"></div>${DUO(.85,'#0047E0','#00B8FF')}
 <div class=abs style="left:90px;right:90px;top:330px;height:640px;border-radius:24px;background:#05070D;border:10px solid #1B1E27;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden;${rise(t,L[4])}">
  ${AVA(t,240,140,1.15)}
  <div class=abs style="left:0;right:0;bottom:30px;text-align:center"><span class=ser style="font-size:58px;background:rgba(0,0,0,.75);padding:6px 20px;color:#fff">${typed('"I believe in forgiveness."',t,b-.1,22)}</span></div></div>
 <div class="abs disp" style="left:64px;right:64px;top:1060px;font-size:96px;${rise(t,W('told',4))}">The AI told the court</div>
 <div class="abs mono" style="left:64px;right:64px;top:1200px;font-size:30px;line-height:1.35;color:#E3F4FF;${rise(t,b+.6)}">Words written by his sister.<br>Chris never said them.</div>
 <div class="abs tag" style="right:64px;top:206px">ILLUSTRATION</div>`};
// 5 A-roll: judge loved it
S[5]=(t)=>`<div class="abs" style="left:0;right:0;top:220px;text-align:center;${pop(t,W('loved',5)-.1)}"><span class=disp style="display:inline-block;rotate:-4deg;font-size:110px;background:#fff;color:#07080C;padding:8px 30px;box-shadow:0 20px 50px rgba(0,0,0,.4)">The judge <span style="color:#FF3D6E">"loved"</span> it</span></div>`;
// 6 sentence
S[6]=(t)=>{const y=W('10',6),v=(10.5*eo(cl((t-y+.2)/.7))).toFixed(1);return `${MESH(t,'alert')}
 <div class="abs chip" style="left:64px;top:220px;background:#fff;color:#D10028;${pop(t,L[6])}">THE SENTENCE</div>
 <div class="abs disp" style="left:0;right:0;top:360px;text-align:center;font-size:400px;opacity:${P(t,y-.3)}">${v}</div>
 <div class="abs disp" style="left:0;right:0;top:760px;text-align:center;font-size:130px;${rise(t,W('years',6))}">years in prison</div>
 <div class=abs style="left:0;right:0;top:960px;text-align:center;${pop(t,W('more',6))}"><span class=disp style="display:inline-block;font-size:76px;background:#07080C;padding:10px 26px">More than prosecutors asked for</span></div>`};
// 7 thrown out
S[7]=(t)=>{const th=W('thrown',7);return `<div class=abs style="inset:-40px;background:url(${D}/bench.jpg) center/cover;filter:grayscale(1) contrast(1.2) brightness(.55);transform:scale(${1.1+(t-L[7])*.03})"></div>${DUO(.9,'#FF3D6E','#FF8A00')}
 <div class=abs style="inset:0;background:rgba(40,0,10,.35)"></div>
 <div class="abs chip" style="left:64px;top:220px;background:#fff;color:#D10028;${pop(t,L[7])}">ARIZONA COURT OF APPEALS · SEPT 30</div>
 <div class="abs disp" style="left:0;right:0;top:470px;text-align:center;${pop(t,th)}"><span style="display:inline-block;rotate:-6deg;font-size:150px;border:12px solid #fff;padding:10px 40px;background:rgba(209,0,40,.85)">Sentence<br>thrown out</span></div>
 <div class="abs mono" style="left:64px;right:64px;top:1060px;text-align:center;font-size:34px;font-weight:700;${rise(t,th+.8)}">Conviction stands. He will be resentenced.</div>
 <div class="abs tag" style="right:64px;top:1180px">REPRESENTATIVE COURTROOM</div>`};
// 8 A-roll: most people get this wrong
S[8]=(t)=>`<div class="abs" style="left:0;right:0;top:230px;text-align:center;${pop(t,W('most',8)-.1)}"><span class=disp style="display:inline-block;font-size:100px;background:#00E5FF;color:#07080C;padding:8px 26px">Most people get this wrong</span></div>`;
// 9 the line
S[9]=(t)=>{const sh=W('show',9),pu=W('put',9);const ROW=(ok,txt,t0,y)=>`<div class=abs style="left:64px;right:64px;top:${y}px;display:flex;align-items:center;gap:30px;${rise(t,t0-.15,40)}"><div style="flex:none;width:130px;height:130px;border-radius:26px;background:${ok?'#00F0C0':'#FF3D6E'};display:flex;align-items:center;justify-content:center"><svg width=80 height=80 viewBox="0 0 24 24">${ok?'<path d="M4 12.5l5 5L20 6.5" fill=none stroke="#07080C" stroke-width=3.6 stroke-linecap=round stroke-linejoin=round/>':'<path d="M6 6l12 12M18 6L6 18" fill=none stroke="#fff" stroke-width=3.6 stroke-linecap=round/>'}</svg></div><div class=disp style="font-size:86px">${txt}</div></div>`;
 return `${MESH(t,'sea')}
 <div class="abs disp" style="left:64px;right:64px;top:220px;font-size:120px;${pop(t,W('ban',9))}">AI is ${BOX('not banned','#fff','#0047E0')} from court</div>
 ${ROW(1,'AI can show what\'s real',sh,620)}
 ${ROW(0,'No words in a dead man\'s mouth',pu,900)}`};
// 10 first ruling
S[10]=(t)=>`${MESH(t,'neon')}
 <div class="abs disp" style="left:64px;right:64px;top:300px;font-size:150px;${pop(t,W('first',10))}">First ruling</div>
 <div class="abs disp" style="left:64px;right:64px;top:460px;font-size:150px;${pop(t,W('first',10)+.2)}">of its kind in ${BOX('Arizona','#FF3D6E','#fff')}</div>
 <div class="abs mono" style="left:64px;right:64px;top:820px;font-size:40px;font-weight:700;color:#00E5FF;${rise(t,W('Arizona',10))}">Other states may look to it next.</div>`;
// 11 A-roll then DO THIS
S[11]=(t)=>{if(isA(t))return `<div class="abs" style="left:0;right:0;top:230px;text-align:center;${pop(t,L[11]+.1)}"><span class=disp style="display:inline-block;font-size:110px;background:#fff;color:#07080C;padding:8px 26px">Do this now</span></div>`;
 const s=W('say',11);return `<div class=abs style="inset:0;background:linear-gradient(160deg,#F2FEFF,#B8F1FF 60%,#9FE6FF)"></div>
 <div class="abs mono" style="left:64px;top:240px;font-size:32px;letter-spacing:5px;font-weight:700;color:#0047E0">WHAT YOU CAN TAKE FROM THIS</div>
 <div class="abs disp" style="left:64px;right:64px;top:300px;font-size:110px;color:#07080C">Don't want an AI of you after you're gone?</div>
 <div class=abs style="left:90px;right:90px;top:720px;border-radius:20px;background:#fff;box-shadow:0 30px 70px rgba(0,40,90,.25);padding:44px 50px;color:#07080C;transform:rotate(-1.5deg);${rise(t,s-.4,40)}">
  <div class=mono style="font-size:28px;font-weight:700;color:#0047E0;letter-spacing:3px">NOTE TO MY FAMILY</div>
  <div class=ser style="font-size:66px;margin-top:20px;min-height:240px">${typed('No AI version of me. Ever.',t,s,20)}</div>
  <div class=mono style="font-size:28px;opacity:${P(t,W('family.',11))}">Signed, me.</div></div>
 <div class="abs disp" style="left:64px;right:64px;top:1240px;font-size:84px;color:#07080C;${rise(t,W('writing',11))}">Say it ${BOX('in writing','#0047E0','#fff')}</div>`};
// 12 say this at work
S[12]=(t)=>`${MESH(t,'sun')}
 <div class="abs chip" style="left:64px;top:240px;background:#07080C;color:#fff;${pop(t,L[12])}">SAY THIS AT WORK</div>
 <div class="abs disp" style="left:64px;right:64px;top:370px;font-size:140px;${rise(t,W('replay',12))}">AI can replay ${BOX('your past','#fff','#FF2E63')}</div>

S[13]=(t)=>{const s=W('send',13);return `<div class=abs style="left:60px;right:60px;top:200px;border-radius:34px;background:rgba(255,255,255,.96);color:#07080C;padding:30px 36px;display:flex;align-items:center;gap:28px;box-shadow:0 24px 60px rgba(0,0,0,.35);${pop(t,s)}">

 <div class="abs chip" style="left:0;right:0;margin:0 auto;width:640px;text-align:center;top:1340px;background:#00E5FF;color:#07080C;${pop(t,W('died.',13)-.6)}">FOLLOW @THEAIKHABARI</div>`};
const DARKCAP=new Set([11]);
function setT(t){
 let i=0;for(let k=0;k<S.length;k++)if(t>=L[k]-.12)i=k;
 const a=isA(t),lt=t-(L[i]-.12),inP=a?1:eo(lt/.28);
 document.getElementById('stage').innerHTML=`<div class=abs style="inset:0;transform:translateX(${(1-inP)*140}px);filter:blur(${(1-inP)*14}px)">${S[i](t,lt)}</div>`;
 document.getElementById('grain').style.display=a?'none':'block';document.getElementById('vig').style.opacity=a?.5:1;
 const beats=[W('thrown',7),W('10',6),W('ban',9)];let pz=0;beats.forEach(b=>{if(t>b&&t<b+.5)pz=Math.max(pz,(1-(t-b)/.5)*.05)});
 document.getElementById('cam').style.transform=`scale(${1+pz+(a?0:Math.sin(t*.7)*.004)}) rotate(${pz*8*Math.sin(t*40)}deg)`;

 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 // flash on A-roll entry
