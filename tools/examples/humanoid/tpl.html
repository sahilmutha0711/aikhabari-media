<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:Mono;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
:root{--ink:#07080C;--cream:#FFFFFF;--acc:#00E5FF;--red:#FF3D6E;--dim:#C9CCD6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#FFD23F}
body{width:1080px;height:1920px;overflow:hidden;font-family:Sans;color:var(--cream);position:relative}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.abs{position:absolute}
.disp{font-family:Disp;line-height:1.0;letter-spacing:0;text-transform:uppercase}
.ser{font-family:Ser;line-height:1.05}
.mono{font-family:Mono}
#grain{position:absolute;inset:-50px;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#brand{position:absolute;left:64px;top:92px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#prog{position:absolute;left:0;top:0;height:8px;background:#fff}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Sans;font-weight:700;font-size:64px;line-height:1.15}
#cap span{padding:2px 12px;border-radius:10px;margin:0 2px;display:inline-block}
.chip{display:inline-block;padding:14px 32px;border-radius:60px;font-family:Mono;font-weight:700;font-size:32px;letter-spacing:2px}
.tag{font-family:Mono;font-size:20px;letter-spacing:3px;color:#fff;border:1px solid rgba(255,255,255,.5);padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.25)}
.box{background:#fff;color:#07080C;padding:0 18px}
.fig{position:absolute;width:300px;height:380px}
.fig .h{position:absolute;left:85px;top:0;width:130px;height:150px;border-radius:65px 65px 60px 60px}
.fig .b{position:absolute;left:0;top:165px;width:300px;height:215px;border-radius:150px 150px 20px 20px}
</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__DIR__/g1.jpg"><img src="__DIR__/optimus.jpg"><img src="__DIR__/altman_cut.png"><img src="__OWLDIR__/closeup.png"><img src="__OWLDIR__/point.png"></div>
<div id="cam"><div id="stage"></div></div>
<svg id="grain" width="1180" height="2020"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig" style="display:none"></div><div id="ov"></div><div id="prog"></div><div id="brand"></div><div id="cap"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const L=[];WD.forEach(w=>{if(L[w.line]===undefined)L[w.line]=w.s});L.push(TOTAL);
function W(word,line,k=0){const c=WD.filter(w=>w.line===line&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:L[line]}
const P=(t,t0,d=.35)=>eo((t-t0)/d), B=(t,t0,d=.45)=>eb((t-t0)/d);
function typed(str,t,t0,cps=38){const n=Math.floor(cl((t-t0)*cps,0,str.length));return str.slice(0,n)+(t>t0&&n<str.length&&Math.floor(t*4)%2?'▍':'')}
function rise(t,t0,dy=60){const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`}
function pop(t,t0){const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`}
const PAL={sun:['#FF4D2E','#FF2E63','#FF9500','#FF6F91'],sea:['#0047E0','#00D4FF','#0020A0','#00F0C0'],neon:['#07080C','rgba(0,229,255,.38)','rgba(255,61,110,.38)','rgba(0,87,255,.35)'],alert:['#D10028','#FF3D6E','#FF6A00','#8A0018']};
function MESH(t,k){const c=PAL[k],a=t*.35;const g=(i,x,y,r)=>`radial-gradient(${r}px ${r}px at ${x}% ${y}%,${c[i]},transparent 70%)`;
 return `<div class=abs style="inset:0;background:${g(1,30+20*Math.sin(a),25+15*Math.cos(a*1.3),900)},${g(2,75+15*Math.cos(a*.9),70+15*Math.sin(a*1.1),1000)},${g(3,50+30*Math.sin(a*.7+2),95+10*Math.cos(a),800)},${c[0]}"></div>`}
const DUO=(o=.85,a='#FF3D6E',b='#FF8A00')=>`<div class=abs style="inset:0;background:linear-gradient(160deg,${a},${b});mix-blend-mode:color;opacity:${o}"></div>`;
const BOX=(s,bg='#fff',fg='#07080C')=>`<span style="background:${bg};color:${fg};padding:0 18px">${s}</span>`;
// glitchy AI avatar silhouette
function AVA(t,x,y,s=1,col='#00E5FF'){const j=Math.sin(t*37)>0.85?((t*997)%14-7):0;let lines='';for(let i=0;i<24;i++){lines+=`<div style="position:absolute;left:0;right:0;top:${i*16}px;height:3px;background:rgba(255,255,255,.12)"></div>`}
 return `<div class=fig style="left:${x}px;top:${y}px;transform:scale(${s}) translateX(${j}px);filter:drop-shadow(0 0 30px ${col})"><div class=h style="background:${col};opacity:.9"></div><div class=b style="background:${col};opacity:.9"></div><div class=abs style="inset:0;overflow:hidden">${lines}</div><div class="abs mono" style="left:0;right:0;top:250px;text-align:center;font-size:44px;font-weight:700;color:#07080C">AI</div></div>`}
const K='__OWLDIR__';
const Y='#FFD23F',R='#FF3B30',I='#111111',LM='#B8F400';
const FLAT=c=>`<div class=abs style="inset:0;background:${c}"></div>`;
const DOTS=(c,o=.12)=>`<div class=abs style="inset:0;background-image:radial-gradient(${c} 3px,transparent 3.5px);background-size:46px 46px;opacity:${o}"></div>`;
const CARD=(img,x,y,w,h,rot,t,t0,cap)=>{const p=B(t,t0,.5);return `<div class=abs style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:#fff;padding:16px 16px 64px;border-radius:10px;box-shadow:14px 14px 0 ${I};transform:rotate(${rot}deg) translateY(${(1-p)*500}px);opacity:${cl((t-t0)/.15)}"><div style="width:100%;height:100%;background:url(${D}/${img}) center 25%/cover;border-radius:4px"></div><div class=mono style="position:absolute;left:18px;right:18px;bottom:16px;font-size:20px;color:#333">${cap}</div></div>`};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const S=[];
S[0]=(t)=>{const app=W('app,',0),legs=W('legs.',0);const cross=cl((t-app)/.25);return `${FLAT(Y)}${DOTS(I,.10)}
 <div class="abs disp" style="left:60px;right:60px;top:170px;font-size:128px;color:${I}">OpenAI's next product</div>
 <div class="abs disp" style="left:60px;top:440px;font-size:128px;color:${I}">won't be <span style="position:relative">${BOX('an app',I,'#fff')}<span style="position:absolute;left:-10px;top:50%;height:16px;background:${R};width:${cross*112}%;transform:rotate(-6deg)"></span></span></div>
 ${CARD('g1.jpg',470,650,520,760,5,t,legs-.55,'humanoid robot (Unitree G1), not OpenAI')}
 <div class="abs disp" style="left:40px;top:700px;font-size:200px;color:#fff;-webkit-text-stroke:6px ${I};text-shadow:12px 12px 0 ${R};transform:rotate(-7deg);${pop(t,legs-.15)}">IT'LL HAVE<br>LEGS</div>`};
S[1]=(t)=>`${FLAT(R)}${DOTS('#fff',.12)}
 <div class=abs style="left:290px;top:${380+Math.sin(t*3)*10}px;width:500px;height:500px;background:url(${K}/closeup.png) center/contain no-repeat;${pop(t,L[1])}"></div>
 <div class="abs ser" style="left:0;right:0;top:930px;text-align:center;font-size:90px;color:#fff;${rise(t,L[1]+.1)}">psst...</div>
 <div class="abs disp" style="left:0;right:0;top:1050px;text-align:center;font-size:150px;color:#fff;${rise(t,L[1]+.3)}">The AI Khabari</div>`;
S[2]=(t)=>{const b=W('building',2),q=W('quote,',2);return `${FLAT(Y)}
 <div class=abs style="right:-40px;top:${560+Math.sin(t*1.4)*6}px;width:760px;height:1000px;background:url(${D}/altman_cut.png) center bottom/contain no-repeat;${rise(t,L[2],80)}"></div>
 <div class="abs chip" style="left:60px;top:200px;background:${I};color:${Y};${pop(t,L[2])}">SAM ALTMAN · OPENAI CEO</div>
 <div class="abs disp" style="left:60px;right:60px;top:300px;font-size:120px;color:${I};${rise(t,W('confirmed',2))}">just confirmed it</div>
 <div class="abs disp" style="left:60px;top:450px;font-size:96px;color:${I};${pop(t,b-.1)}">${BOX('OpenAI is building',R,'#fff')}<br>${BOX('a humanoid robot',R,'#fff')}</div>
 <div class=abs style="left:40px;width:500px;top:1020px;background:#fff;border:6px solid ${I};border-radius:24px;padding:30px 34px;box-shadow:12px 12px 0 ${I};${pop(t,q)}"><div class=ser style="font-size:120px;line-height:.6;color:${R}">“</div><div class=ser style="font-size:62px;color:${I}">We will definitely do a humanoid.</div><div class=mono style="font-size:22px;margin-top:14px;color:#444">SAM ALTMAN, via Engadget · Oct 17</div></div>
 <div class="abs mono" style="left:60px;top:1440px;font-size:18px;color:#5a4a00">Photo: Village Global / CC BY 2.0</div>`};
const ICON={
 stairs:`<svg viewBox="0 0 100 100" width=200 height=200><path d="M10 90H35V70H55V50H75V30H92" fill=none stroke="#111" stroke-width=9 stroke-linejoin=round stroke-linecap=round/></svg>`,
 door:`<svg viewBox="0 0 100 100" width=200 height=200><rect x=24 y=8 width=52 height=86 rx=4 fill=none stroke="#111" stroke-width=8/><path d="M60 52h18" stroke="#FF3B30" stroke-width=10 stroke-linecap=round/><circle cx=60 cy=52 r=6 fill="#FF3B30"/></svg>`,
 kitchen:`<svg viewBox="0 0 100 100" width=200 height=200><rect x=10 y=40 width=80 height=52 rx=4 fill=none stroke="#111" stroke-width=8/><circle cx=32 cy=24 r=9 fill=none stroke="#111" stroke-width=7/><circle cx=68 cy=24 r=9 fill=none stroke="#111" stroke-width=7/><rect x=24 y=54 width=52 height=26 rx=3 fill="#FF3B30"/></svg>`};
S[3]=(t)=>{const it=[['stairs','Stairs','stairs'],['door','Door handles','door'],['kitchen','Kitchens','kitchens']];let h=`${FLAT('#FFFFFF')}${DOTS(I,.07)}
 <div class="abs disp" style="left:60px;right:60px;top:190px;font-size:150px;color:${I};${pop(t,L[3])}">Why a ${BOX('human',R,'#fff')} shape?</div>
 <div class="abs ser" style="left:60px;right:60px;top:520px;font-size:78px;color:${I};${rise(t,W('because',3))}">Because the world is built for people.</div>`;
 it.forEach((x,i)=>{const t0=W(x[2],3);h+=`<div class=abs style="left:${60+i*330}px;top:820px;width:300px;text-align:center;${pop(t,t0-.1)}"><div style="width:280px;height:280px;margin:0 auto;background:${Y};border:6px solid ${I};border-radius:30px;box-shadow:10px 10px 0 ${I};display:flex;align-items:center;justify-content:center">${ICON[x[0]]}</div><div class=disp style="font-size:62px;margin-top:26px;color:${I}">${x[1]}</div></div>`});return h};
S[4]=(t)=>{const miss=W('miss.',4),bd=W('body',4),br=W('brain',4),has=W('has',4);const x=cl((t-W('isn\'t',4))/.3);return `${FLAT(LM)}
 <div class="abs mono" style="left:60px;top:200px;font-size:34px;font-weight:700;letter-spacing:4px;color:${I};${rise(t,L[4])}">WHAT MOST PEOPLE MISS</div>
 <div class=abs style="left:60px;width:450px;top:300px;height:520px;background:#fff;border:6px solid ${I};border-radius:30px;box-shadow:12px 12px 0 ${I};${pop(t,bd-.15)}"><div class=disp style="font-size:150px;text-align:center;margin-top:100px;color:${I}">BODY</div><div class=mono style="font-size:34px;text-align:center;font-weight:700;color:#111">not the hard part</div><div class=abs style="left:40px;right:40px;top:240px;height:16px;background:${R};transform:rotate(-12deg) scaleX(${x});transform-origin:left"></div></div>
 <div class=abs style="left:570px;width:450px;top:300px;height:520px;background:${I};border:6px solid ${I};border-radius:30px;box-shadow:12px 12px 0 ${R};${pop(t,br-.15)}"><div class=disp style="font-size:150px;text-align:center;margin-top:100px;color:${LM}">BRAIN</div><div class=mono style="font-size:34px;text-align:center;font-weight:700;color:#fff">the hard part</div></div>
 <div class="abs disp" style="left:60px;right:60px;top:940px;font-size:118px;color:${I};${pop(t,has-.2)}">OpenAI already ${BOX('has the brain',I,LM)}</div>`};
S[5]=(t)=>{const n=W('27',5),d=W('2027',5);const v=27*eo(cl((t-n+.15)/.6));return `${FLAT(Y)}${DOTS(I,.10)}
 <div class="abs mono" style="left:60px;top:200px;font-size:34px;font-weight:700;letter-spacing:4px;color:${I};${rise(t,L[5])}">OPENAI CAREERS PAGE, RIGHT NOW</div>
 <div class="abs disp" style="left:40px;top:250px;font-size:520px;color:${I};text-shadow:16px 16px 0 ${R};opacity:${P(t,n-.3)}">${Math.round(v)}</div>
 <div class="abs disp" style="left:560px;top:420px;font-size:110px;color:${I};${pop(t,W('robotics',5))}">robotics<br>${BOX('roles',I,Y)}</div>
 <div class=abs style="left:60px;right:60px;top:950px;background:${I};color:#fff;border-radius:30px;padding:34px 40px;display:flex;justify-content:space-between;align-items:center;${pop(t,W('demo',5)-.2)}"><div class=mono style="font-size:40px;font-weight:700;letter-spacing:3px">FIRST DEMO</div><div class=disp style="font-size:170px;color:${Y};opacity:${P(t,d-.1)}">2027</div></div>`};
S[6]=(t)=>{const op=W('tesla',6);return `${FLAT(R)}${DOTS('#fff',.10)}
 <div class="abs disp" style="left:60px;top:190px;font-size:200px;color:#fff;${pop(t,L[6])}">The catch</div>
 <div class="abs mono" style="left:60px;right:60px;top:440px;font-size:56px;line-height:1.3;padding:28px 30px;border-radius:18px;background:#fff;color:${I};border:5px solid ${I};box-shadow:10px 10px 0 ${I};opacity:${P(t,W('altman',6)-.1,.25)}"><b>[!]</b> ${typed('Robots on our streets? Still a few years away.',t,W('altman',6)-.1,22)}</div>
 ${CARD('optimus.jpg',480,760,460,620,5,t,op-.35,'Tesla Optimus · S. Jurvetson / CC BY 2.0')}
 <div class="abs chip" style="left:120px;top:1100px;background:${I};color:#fff;${pop(t,W('optimus',6)-.2)}">RIVAL: TESLA</div>`};
S[7]=(t)=>{const sm=W('smartest',7);return `${FLAT(I)}
 <div class="abs chip" style="left:60px;top:220px;background:${Y};color:${I};${pop(t,L[7])}">SAY THIS AT WORK</div>
 <div class="abs disp" style="left:60px;right:60px;top:360px;font-size:118px;color:#fff;${rise(t,W('robot',7))}">The robot race won't be won by the <span style="color:#888;text-decoration:line-through;text-decoration-color:${R};text-decoration-thickness:12px">shiniest body</span></div>
 <div class="abs disp" style="left:60px;right:60px;top:880px;font-size:140px;color:#fff;${pop(t,sm-.25)}">It'll be won by the ${BOX('smartest brain',Y,I)}</div>`};
S[8]=(t)=>`${FLAT(Y)}${DOTS(I,.10)}
 <div class=abs style="left:60px;right:60px;top:240px;border-radius:34px;background:#fff;color:${I};border:6px solid ${I};box-shadow:12px 12px 0 ${I};padding:30px 36px;display:flex;align-items:center;gap:28px;${pop(t,L[8])}">
  <svg width=90 height=90 viewBox="0 0 24 24" style="flex:none"><path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z" fill="${R}"/></svg>
  <div><div class=mono style="font-size:26px;font-weight:700;color:${R};letter-spacing:2px">SEND THIS TO</div><div class=disp style="font-size:68px">the friend who still thinks AI is just a chatbot</div></div></div>
 <div class="abs chip" style="left:60px;top:720px;background:${I};color:${Y};${pop(t,W('chatbot.',8)-.4)}">FOLLOW @THEAIKHABARI</div>
 <div class=abs style="right:30px;top:${900+Math.sin(t*3)*12}px;width:460px;height:460px;background:url(${K}/point.png) center/contain no-repeat;transform:scaleX(-1);opacity:${P(t,L[8]+.3,.4)}"></div>
 <div class="abs mono" style="left:60px;right:60px;top:1800px;font-size:19px;color:#5a4a00">Sources: Engadget, Fortune, OpenAI careers (Oct 17). Voice: ElevenLabs.</div>`;
const LIGHT=new Set([0,2,3,4,5,8]);
function setT(t){
 let i=0;for(let k=0;k<S.length;k++)if(t>=L[k]-.12)i=k;
 const lt=t-(L[i]-.12),inP=eo(lt/.28);
 document.getElementById('stage').innerHTML=`<div class=abs style="inset:0;transform:translateX(${(1-inP)*140}px);filter:blur(${(1-inP)*14}px)">${S[i](t,lt)}</div>`;
 document.getElementById('ov').innerHTML='';
 const beats=[W('legs.',0),W('27',5),W('smartest',7)];let pz=0;beats.forEach(b=>{if(t>b&&t<b+.5)pz=Math.max(pz,(1-(t-b)/.5)*.05)});
 document.getElementById('cam').style.transform=`scale(${1+pz+Math.sin(t*.7)*.004}) rotate(${pz*8*Math.sin(t*40)}deg)`;
 document.getElementById('tb').setAttribute('seed',Math.floor(t*24)%97+1);
 document.getElementById('grain').style.transform=`translate(${(t*137)%40-20}px,${(t*91)%40-20}px)`;
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 const light=LIGHT.has(i),br=document.getElementById('brand');br.innerHTML=`<span style="color:${light?'#FF3B30':'#FFD23F'}">&#9679;</span> THE AI KHABARI`;br.style.color=light?'#07080C':'#fff';
 document.getElementById('prog').style.background=light?'#111':'#fff';
 const cur=WD.findIndex(w=>t>=w.s&&t<w.e+.05);const cap=document.getElementById('cap');
 if(cur<0){cap.innerHTML='';return}
 const g=Math.floor(cur/3)*3,grp=WD.slice(g,g+3).filter(w=>w.line===WD[cur].line);
 cap.innerHTML=grp.map(w=>{const on=w===WD[cur];return `<span style="${on?(light?'background:#07080C;color:#fff':'background:#fff;color:#07080C')+';transform:scale(1.08)':'color:'+(light?'#07080C':'#fff')+';text-shadow:'+(light?'none':'0 4px 18px rgba(0,0,0,.8)')}">${w.w}</span>`}).join(' ');
}
setT(0);
</script></body></html>
