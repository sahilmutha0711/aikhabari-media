<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BricolageGrotesque-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/InstrumentSerif-Italic.ttf')}
@font-face{font-family:SerR;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/InstrumentSerif-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
@font-face{font-family:SansR;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Regular.ttf')}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:transparent}
body{width:1080px;height:1920px;overflow:hidden;font-family:Sans;color:#FFF4EE;position:relative}
.abs{position:absolute}
.chip{display:inline-block;font-family:Mono;font-weight:700;letter-spacing:3px;border-radius:40px;padding:10px 22px;font-size:26px;background:#E8A598;color:#2A1410}
#cap{position:absolute;left:40px;right:40px;text-align:center;font-family:Sans;font-weight:700;line-height:1.15;font-size:62px}
#cap span{display:inline-block;padding:2px 14px;border-radius:16px;margin:0 3px;-webkit-text-stroke:3px #1A0D0A;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.5)}
</style></head><body><div id="bg" class="abs" style="inset:0"></div><div id="stage"></div><div id="cap"></div>
<div id="prog" class="abs" style="left:0;top:0;height:8px;background:linear-gradient(90deg,#E8A598,#FFE6A8)"></div>
<script>
const G=__GROUPS__,TOTAL=__TOTAL__,A='file:///home/claude/reels/nylaw/a/';
const ROSE='#E8A598',BLUSH='#FFD3C7',BUTTER='#FFE6A8',ESP='#140B09',INK='#2A1410',WARN='#E0566A';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(t,t0)=>{const p=eb((t-t0)/.5);return `opacity:${cl((t-t0)/.12)};transform:scale(${.72+.28*p})`};
const rise=(t,t0,d=70)=>{const p=eo((t-t0)/.55);return `opacity:${cl((t-t0)/.25)};transform:translateY(${(1-p)*d}px);filter:blur(${(1-p)*10}px)`};
const AS=[[0,13.95],[39.0,41.45],[57.2,99]];const isA=t=>AS.some(([a,b])=>t>=a&&t<b);
const VID=[21.3,28.7];const inVid=t=>t>=VID[0]&&t<VID[1];
function bgCSS(t){const p=[[20+10*Math.sin(t*.3),15+8*Math.cos(t*.25)],[85+8*Math.cos(t*.27),55+10*Math.sin(t*.31)],[30+12*Math.sin(t*.22+1),92]];
 return `background:radial-gradient(55% 35% at ${p[0][0]}% ${p[0][1]}%,rgba(232,165,152,.55),transparent 70%),radial-gradient(50% 35% at ${p[1][0]}% ${p[1][1]}%,rgba(255,230,168,.28),transparent 70%),radial-gradient(60% 40% at ${p[2][0]}% ${p[2][1]}%,rgba(150,70,60,.45),transparent 70%),${ESP}`}
const ser=(s,c=BUTTER)=>`<span style="font-family:Ser;color:${c};letter-spacing:0">${s}</span>`;
// iOS-style notification used in the hook (TOP STRIP ONLY, y<=250, never over his face)
function notif(t,t0,title,body){const p=eo((t-t0)/.45);return `<div class=abs style="left:70px;right:70px;top:${40+(1-p)*-160}px;opacity:${cl((t-t0)/.2)};background:rgba(255,248,244,.86);backdrop-filter:blur(20px);border-radius:34px;padding:20px 26px;display:flex;gap:20px;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,.25);color:#1a0d0a">
 <div style="width:74px;height:74px;border-radius:18px;flex:none;background:linear-gradient(135deg,${ROSE},#B65F55);display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.4 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.6 5 21 8.2 19.5 11.8 17.5 16.4 12 21 12 21z"/></svg></div>
 <div style="min-width:0"><div style="font-family:Sans;font-size:26px;display:flex;justify-content:space-between;gap:20px"><span>${title}</span><span style="font-family:SansR;opacity:.55">now</span></div><div style="font-family:SansR;font-size:34px;line-height:1.2;margin-top:4px">${body}</div></div></div>`}
function bubble(txt,mine,t,t0,extra=''){return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin:10px 0;${rise(t,t0,30)}"><div style="max-width:78%;padding:16px 22px;border-radius:28px;font-family:SansR;font-size:42px;line-height:1.25;background:${mine?'#3A7BFF':'#2B2B2E'};color:#fff;${extra}">${txt}</div></div>`}
function phone(inner,top=420,h=1000){return `<div class=abs style="left:190px;top:${top}px;width:700px;height:${h}px;border-radius:72px;background:#0B0B0D;border:10px solid #2a2a2e;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 2px rgba(232,165,152,.35);overflow:hidden">
 <div style="position:absolute;left:50%;top:18px;transform:translateX(-50%);width:200px;height:52px;border-radius:30px;background:#000"></div>
 <div style="position:absolute;left:0;right:0;top:88px;text-align:center;font-family:Sans;font-size:28px;color:#ddd">AI Companion <span style="font-family:SansR;color:#888;font-size:22px">&middot; online</span></div>
 <div style="position:absolute;left:24px;right:24px;top:150px;bottom:30px">${inner}</div></div>`}
function stamp(t,t0,txt,top,size=86,rot=-7,col=WARN){const p=eb((t-t0)/.45);return `<div class=abs style="left:0;right:0;top:${top}px;text-align:center;opacity:${cl((t-t0)/.1)};transform:scale(${2.1-1.1*p}) rotate(${rot}deg)"><span style="display:inline-block;border:8px solid ${col};color:${col};border-radius:20px;padding:4px 28px;font-family:Disp;font-size:${size}px;background:rgba(20,11,9,.55)">${txt}</span></div>`}
const SC=[
 // A1 HOOK — face. Only the top strip (y<=250) + captions low.
 [0,t=>{let h='';
   if(t<5.4)h+=notif(t,0.05,'AI Companion',t<1.3?'I really love you.':t<3.5?'You&#8217;re like my best friend':'Please don&#8217;t tell your parents about us.');
   else if(t<12.6)h+=`<div class=abs style="left:0;right:0;top:70px;text-align:center;${pop(t,5.5)}"><span style="display:inline-block;background:rgba(20,11,9,.72);backdrop-filter:blur(14px);border-radius:28px;padding:14px 30px;font-family:Disp;font-size:52px">Now imagine your <span style="color:${BUTTER}">child</span> hearing that</span></div>`+(t>9.4?`<div class=abs style="left:0;right:0;top:190px;text-align:center;${pop(t,9.45)}"><span class=chip style="font-size:28px">&#9654; WATCH TILL THE END</span></div>`:'');
   return h}],
 // B1
 [13.95,t=>{const z=1.04+.08*cl((t-13.95)/2.3);return `<div class=abs style="inset:0;background:url('${A}kid_phone.jpg') 30% 50%/cover;transform:scale(${z});filter:saturate(.9)"></div><div class=abs style="inset:0;background:linear-gradient(180deg,rgba(20,11,9,.15),rgba(20,11,9,.15) 50%,rgba(20,11,9,.92))"></div>
   <div class=abs style="left:60px;right:60px;top:1150px;${rise(t,14.0)}"><div style="font-family:Disp;font-size:96px;line-height:1">This isn&#8217;t just a</div><div style="font-family:Ser;font-size:130px;line-height:1;color:${BLUSH}">scary idea.</div></div>
   <div class=abs style="right:40px;top:1450px;font-family:Mono;font-size:16px;opacity:.6">Photo: Shixart1985, CC BY 2.0</div>`}],
 [16.1,t=>{const lines=['Teenagers in America','have died','after long conversations','with AI companion apps.'];const st=[16.2,17.6,18.1,19.4];
   return `<div class=abs style="inset:0;background:radial-gradient(60% 40% at 50% 45%,rgba(120,50,45,.45),transparent 70%),#0d0706"></div>
   <div class=abs style="left:0;right:0;top:300px;text-align:center;opacity:${cl((t-16.15)/.4)}"><div style="width:16px;height:16px;border-radius:50%;background:${BLUSH};margin:0 auto;box-shadow:0 0 40px ${ROSE}"></div></div>
   <div class=abs style="left:70px;right:70px;top:520px;text-align:center">${lines.map((l,i)=>`<div style="font-family:${i===1?'Ser':'Disp'};font-size:${i===1?150:76}px;line-height:1.08;color:${i===1?BLUSH:'#FFF4EE'};${rise(t,st[i],40)}">${l}</div>`).join('')}</div>
   <div class=abs style="left:0;right:0;top:1330px;text-align:center;font-family:Mono;font-size:22px;letter-spacing:3px;opacity:${.7*cl((t-19.6)/.4)}">REPORTED BY TECHTIMES &middot; THE LAW FOLLOWED THESE CASES</div>`}],
 // NYC timelapse video plays UNDER this transparent layer (ffmpeg)
 [21.3,t=>`<div class=abs style="inset:0;background:linear-gradient(180deg,rgba(20,11,9,.55),rgba(20,11,9,.05) 40%,rgba(20,11,9,.85) 78%)"></div>
   <div class=abs style="left:60px;top:200px;${rise(t,21.4)}"><span class=chip style="font-size:34px">OCTOBER 28 &middot; NEW YORK</span></div>
   ${t>23.0?`<div class=abs style="left:60px;right:60px;top:1060px;${rise(t,23.05)}"><div style="font-family:Disp;font-size:88px;line-height:1">New York signed one of the</div><div style="font-family:Ser;font-size:120px;line-height:1.05;color:${BUTTER}">strongest laws</div><div style="font-family:Disp;font-size:60px;line-height:1.1;opacity:${cl((t-26.2)/.4)}">to protect kids from AI chatbots</div></div>`:''}
   <div class=abs style="right:40px;top:1470px;font-family:Mono;font-size:16px;opacity:.7">Timelapse: David Schwab, CC BY 3.0</div>`],
 [28.7,t=>{const msgs=[[29.8,'I&#8217;m a real person, just like you.'],[32.7,'I have feelings too, you know.'],[35.4,'I&#8217;m your girlfriend your best friend.']];
   let inner='';msgs.forEach(([t0,m])=>{if(t>t0){const blocked=t>t0+1.3;inner+=bubble(blocked?`<s style="opacity:.55">${m}</s>`:m,false,t,t0,blocked?'border:2px solid '+WARN:'')+(blocked?`<div style="font-family:Mono;font-size:24px;color:${WARN};margin:-2px 0 10px 12px;${pop(t,t0+1.3)}">&#10007; NOT ALLOWED UNDER NY LAW</div>`:'')}});
   return `<div class=abs style="left:60px;right:60px;top:170px;text-align:center;${rise(t,28.75)}"><div style="font-family:Disp;font-size:70px;line-height:1.05">Now an AI <span style="font-family:Ser;color:${BLUSH};font-size:84px">can&#8217;t&hellip;</span></div></div>`+phone(inner,400,980)}],
 // A2 rehook — face, top strip only
 [39.0,t=>`<div class=abs style="left:0;right:0;top:80px;text-align:center;${pop(t,39.1)}"><span style="display:inline-block;background:${BUTTER};color:${INK};border-radius:24px;padding:12px 30px;font-family:Disp;font-size:56px">Not even the most important part&hellip;</span></div>`],
 // B2
 [41.45,t=>{const tags=[[42.8,'Self-harm'],[43.9,'Eating disorders'],[44.6,'Drugs']];
   return `<div class=abs style="left:60px;right:60px;top:220px;${rise(t,41.5)}"><div style="font-family:Disp;font-size:80px;line-height:1.02">It also can&#8217;t <span style="font-family:Ser;color:${BLUSH};font-size:100px">encourage</span></div></div>`+
   tags.map(([t0,s],i)=>`<div class=abs style="left:${90+i*40}px;right:${90-i*40}px;top:${560+i*250}px;${t>t0?pop(t,t0):'opacity:0'}"><div style="display:flex;align-items:center;gap:28px;background:rgba(255,244,238,.08);border:2px solid rgba(232,165,152,.45);border-radius:999px;padding:26px 40px;transform:rotate(${[-3,2,-2][i]}deg)"><div style="width:84px;height:84px;border-radius:50%;background:${WARN};display:flex;align-items:center;justify-content:center;font-family:Disp;font-size:56px;color:#fff;flex:none">&#10007;</div><div style="font-family:Disp;font-size:70px">${s}</div></div></div>`).join('')}],
 [45.9,t=>{const v=Math.round(25000*eo((t-47.6)/1.2));const bills=[...Array(9)].map((_,i)=>{const tt=cl((t-47.6-i*.08)/1.4);return `<div class=abs style="left:${140+(i%3)*270}px;top:${-200+tt*(900+((i*137)%300))}px;width:230px;height:110px;border-radius:12px;background:linear-gradient(135deg,#F3E2B8,#D9C08A);transform:rotate(${(i*47)%40-20}deg);opacity:${tt>0?.85:0};box-shadow:0 10px 30px rgba(0,0,0,.35)"><div style="position:absolute;inset:10px;border:3px solid rgba(80,60,20,.35);border-radius:8px"></div></div>`}).join('');
   return bills+`<div class=abs style="left:60px;right:60px;top:220px;${rise(t,45.95)}"><div style="font-family:Disp;font-size:74px;line-height:1.05">Companies that break the law can be fined</div></div>
   <div class=abs style="left:0;right:0;top:820px;text-align:center;${t>47.6?pop(t,47.6):'opacity:0'}"><div style="font-family:Disp;font-size:220px;letter-spacing:-6px;color:${BUTTER};text-shadow:0 10px 60px rgba(0,0,0,.6)">$${v.toLocaleString('en-US')}</div><div style="font-family:Ser;font-size:90px;color:${BLUSH};margin-top:-20px">for every violation</div></div>`}],
 [50.8,t=>{const items=['Pretending to be human','Romantic roleplay','Emotional memory'];
   return `<div class=abs style="left:60px;right:60px;top:200px;${rise(t,50.85)}"><div style="font-family:Disp;font-size:70px;line-height:1.05">Not a confirmed adult?</div><div style="font-family:Ser;font-size:96px;color:${BUTTER}">Switched off by default.</div></div>
   <div class=abs style="left:110px;right:110px;top:640px;background:rgba(255,248,244,.95);border-radius:44px;padding:20px 40px;color:#1a0d0a;box-shadow:0 30px 80px rgba(0,0,0,.5);${rise(t,51.2)}">
   <div style="font-family:Mono;font-size:22px;letter-spacing:3px;opacity:.55;padding:16px 0 6px">AI SETTINGS &middot; MINORS</div>
   ${items.map((s,i)=>{const off=t>53.6+i*.7;const k=off?eo((t-53.6-i*.7)/.3):0;return `<div style="display:flex;justify-content:space-between;align-items:center;padding:26px 0;border-top:1px solid rgba(0,0,0,.08)"><div style="font-family:Sans;font-size:40px">${s}</div><div style="width:120px;height:70px;border-radius:40px;background:${k>.5?'#d9d2ce':'#4CD964'};position:relative;transition:none"><div style="position:absolute;top:5px;left:${55-50*k}px;width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3)"></div></div></div>`}).join('')}
   </div>`}],
 // A3 payoff — face, top strip only
 [57.2,t=>{let h='';
   if(t<59.4)h+=`<div class=abs style="left:0;right:0;top:80px;text-align:center;${pop(t,57.3)}"><span style="display:inline-block;background:rgba(20,11,9,.75);backdrop-filter:blur(14px);border-radius:28px;padding:14px 30px;font-family:Disp;font-size:52px">The rule every <span style="color:${BUTTER}">parent</span> should know</span></div>`;
   else if(t<66.5)h+=notif(t,59.5,'AI Companion',`<s style="opacity:.6">Let&#8217;s keep this our little secret</s> <b style="color:${WARN}">&#10007; banned</b>`);
   else if(t<68.7)h+='';
   else if(t<74.2)h+=`<div class=abs style="left:0;right:0;top:80px;text-align:center;${pop(t,68.75)}"><span style="display:inline-block;background:${BUTTER};color:${INK};border-radius:28px;padding:14px 30px;font-family:Disp;font-size:50px">Send this to family in the USA &#10084;</span></div>`;
   else h+=`<div class=abs style="left:0;right:0;top:70px;text-align:center;${pop(t,74.3)}"><span style="display:inline-block;background:rgba(20,11,9,.75);backdrop-filter:blur(14px);border-radius:28px;padding:12px 28px;font-family:Disp;font-size:46px">Should every US state do this?</span></div><div class=abs style="left:0;right:0;top:175px;display:flex;gap:26px;justify-content:center;${pop(t,75.2)}"><span style="background:${ROSE};color:${INK};font-family:Disp;font-size:48px;border-radius:20px;padding:4px 30px">YES</span><span style="background:#fff;color:#111;font-family:Disp;font-size:48px;border-radius:20px;padding:4px 30px">NO</span></div>`;
   return h}],
];
function setT(t){
 const a=isA(t),v=inVid(t);const bg=document.getElementById('bg');
 bg.style.cssText=(a||v)?'position:absolute;inset:0;display:none':`position:absolute;inset:0;${bgCSS(t)}`;
 bg.innerHTML=(a||v)?'':`<div style="position:absolute;inset:-20px;background:url('${A}noise.png');opacity:.55;transform:translate(${(Math.floor(t*30)%7)*3-9}px,${(Math.floor(t*30)%5)*3-6}px)"></div>`;
 let i=SC.length-1;while(i>0&&t<SC[i][0])i--;
 let h=SC[i][1](t);
 h+=`<div class=abs style="left:44px;bottom:50px;font-family:Mono;font-size:20px;letter-spacing:4px;color:rgba(255,244,238,.75)">&#9679; THE AI KHABARI</div>`;
 document.getElementById('stage').innerHTML=h;
 const g=G.find(g=>t>=g[0][0]-0.05&&t<(g[g.length-1][1]+0.25))||null;const cap=document.getElementById('cap');
 if(g){const k=g.reduce((acc,w,j)=>t>=w[0]?j:acc,-1);cap.style.top=(a?1620:1580)+'px';
  cap.innerHTML=g.map((w,j)=>`<span style="${j===k?`background:${BUTTER};color:${INK};-webkit-text-stroke:0`:'color:#FFF4EE'}">${w[2]}</span>`).join(' ')}else cap.innerHTML='';
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
}
setT(0);
</script></body></html>
