<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
:root{--teal:#00525C;--deep:#002E34;--coral:#FF6B4A;--cream:#F4EFE6;--gold:#FFC93C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{width:1080px;height:1920px;overflow:hidden;font-family:Sans;color:#fff;position:relative}
.abs{position:absolute}
.disp{font-family:Disp;line-height:.98;text-transform:uppercase}
.ser{font-family:Ser;line-height:1.05}
.mono{font-family:Mono}
#brand{position:absolute;left:56px;top:96px;font-family:Mono;font-weight:700;font-size:24px;letter-spacing:4px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#prog{position:absolute;left:0;top:0;height:7px;background:var(--coral)}
#cap{position:absolute;left:50px;right:50px;top:1230px;text-align:center;font-family:Sans;font-weight:700;font-size:74px;line-height:1.12;letter-spacing:-.5px}
#cap span{display:inline-block;padding:0 12px;border-radius:14px;margin:0 1px;-webkit-text-stroke:2.5px #000;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.55)}
.chip{display:inline-block;padding:12px 28px;border-radius:60px;font-family:Mono;font-weight:700;font-size:30px;letter-spacing:2px}
.card{background:var(--cream);color:var(--deep);border-radius:30px;box-shadow:12px 12px 0 var(--deep)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.5px);background-size:40px 40px}
</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__DIR__/demis_cut.png"><img src="__DIR__/demis2.jpg"></div>
<div id="stage"></div><div id="ov"></div><div id="prog"></div><div id="brand"></div><div id="cap"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const base=s=>s.replace(/[0-9]+$/,'');
const SS={},SE={};WD.forEach(w=>{const k=w.seg;if(SS[k]===undefined)SS[k]=w.s;SE[k]=w.e});
const has=k=>SS[k]!==undefined;
function W(word,seg,k=0){const c=WD.filter(w=>w.seg===seg&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:(SS[seg]??0)}
const P=(t,t0,d=.35)=>eo((t-t0)/d),B=(t,t0,d=.45)=>eb((t-t0)/d);
const rise=(t,t0,dy=60)=>{const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`};
const pop=(t,t0)=>{const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`};
const BOX=(s,bg,fg)=>`<span style="background:${bg};color:${fg};padding:0 16px">${s}</span>`;
const BG=(t,c1='#00525C')=>`<div class=abs style="inset:0;background:${c1}"></div><div class=dots></div><div class=abs style="right:-260px;top:${1180+Math.sin(t*.6)*12}px;width:760px;height:760px;border-radius:50%;background:#F4EFE6;opacity:.96"></div><div class=abs style="left:-200px;top:1700px;width:1500px;height:400px;background:#FF6B4A;transform:rotate(-4deg)"></div>`;
// scenes: [first seg, type A(aroll)/B(broll), render]
const SC=[];
SC.push(['A','A',t=>{const s2=SS['A2']??99;return `<div class=abs style="left:0;right:0;top:0;height:620px;background:linear-gradient(180deg,rgba(0,30,34,.85),transparent)"></div>
 <div class="abs disp" style="left:0;right:0;top:170px;text-align:center;font-size:128px;text-shadow:0 8px 30px rgba(0,0,0,.6)">AGI in <span style="color:#FFC93C">2&ndash;3 years?</span></div>
 ${t>s2-.1?`<div class=abs style="left:0;right:0;top:350px;text-align:center;${pop(t,s2-.1)}"><span class=disp style="display:inline-block;rotate:-5deg;font-size:120px;background:#FF6B4A;color:#fff;padding:6px 30px;border:7px solid #002E34;box-shadow:10px 10px 0 #002E34">Not buying it</span></div>`:''}`}]);
SC.push(['B','B',t=>{const nb=W('nobel','B2');return `${BG(t)}
 <div class=abs style="left:250px;right:-140px;bottom:430px;height:1100px;background:url(${D}/demis_cut.png) center bottom/contain no-repeat;${rise(t,SS['B'],80)}"></div>
 <div class="abs chip" style="left:56px;top:190px;background:#F4EFE6;color:#00525C;${pop(t,SS['B'])}">GOOGLE DEEPMIND CEO</div>
 <div class="abs disp" style="left:56px;top:270px;font-size:170px;color:#F4EFE6;text-shadow:10px 10px 0 #002E34;${rise(t,SS['B']+.1)}">Demis<br>Hassabis</div>
 ${t>nb-.2?`<div class=abs style="left:40px;top:680px;transform:rotate(-6deg);${pop(t,nb-.2)}"><div style="width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#E3A21A 60%,#9C6A00);border:8px solid #002E34;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3A2600;text-align:center;box-shadow:10px 10px 0 #002E34"><div class=disp style="font-size:66px">Nobel</div><div class=disp style="font-size:46px">Prize 2024</div><div class=mono style="font-size:22px;margin-top:6px">CHEMISTRY</div></div></div>`:''}
 <div class="abs mono" style="left:56px;top:1660px;font-size:18px;color:#F4EFE6">Photo: Arthur Petron / CC BY-SA 4.0 · Nobel for AlphaFold (protein structure AI)</div>`}]);
SC.push(['C','B',t=>{const n=W('2','C');return `${BG(t,'#F4EFE6')}
 <div class=abs style="left:70px;right:70px;top:250px;background:#fff;color:#111;border:4px solid #111;border-radius:12px;padding:40px 44px;box-shadow:14px 14px 0 #00525C;${rise(t,SS['C'])}">
  <div class=ser style="font-size:46px;border-bottom:3px solid #111;padding-bottom:16px">Wall Street Journal interview</div>
  <div class=mono style="font-size:26px;color:#555;margin-top:20px">OCT 2026 · DEMIS HASSABIS</div>
  <div class=disp style="font-size:150px;margin-top:20px;color:#111">AGI in ${t>n-.2?BOX('2&ndash;3 years','#FF6B4A','#fff'):'...'}</div></div>`}]);
SC.push(['D','B',t=>{const e=SS['E']??99;const coworker=t>e-.1;return `${BG(t)}
 <div class="abs mono" style="left:56px;top:190px;font-size:30px;letter-spacing:4px;color:#FFC93C">SO WHAT IS AGI?</div>
 <div class="abs card" style="left:56px;right:56px;top:260px;padding:34px 40px;${pop(t,SS['D'])}">
  <div class=mono style="font-size:26px">TODAY'S AI (LIKE CHATGPT)</div><div class=disp style="font-size:120px;margin-top:6px">= A tool</div>
  <div style="margin-top:14px;display:flex;gap:14px;align-items:center;font-size:36px"><span style="background:#00525C;color:#fff;border-radius:20px;padding:10px 20px">you give instructions</span><span class=disp style="font-size:60px">&rarr;</span><span style="background:#FF6B4A;color:#fff;border-radius:20px;padding:10px 20px">it does a task</span></div></div>
 ${coworker?`<div class=abs style="left:56px;right:56px;top:720px;background:#FF6B4A;color:#fff;border-radius:30px;padding:34px 40px;box-shadow:12px 12px 0 #002E34;${pop(t,e-.1)}">
  <div class=mono style="font-size:26px">AGI</div><div class=disp style="font-size:110px;margin-top:6px">= A coworker who learns any job</div>
  <div style="margin-top:16px;display:flex;gap:14px;font-size:38px;flex-wrap:wrap"><span style="background:#fff;color:#002E34;border-radius:20px;padding:8px 20px;opacity:${P(t,W('taxes,','E'))}">your taxes</span><span class=disp style="font-size:56px;opacity:${P(t,W('taxes,','E'))}">&rarr;</span><span style="background:#fff;color:#002E34;border-radius:20px;padding:8px 20px;opacity:${P(t,W('science','E'))}">science experiments</span></div></div>`:''}`}]);
SC.push(['F','B',t=>{const rows=[['2025','5&ndash;10 years',10,W('2025,','G')],['EARLY 2026','3&ndash;5 years',5,W('2026,','H')],['NOW','2&ndash;3 years',3,W('2','I2')]];
 let h='';rows.forEach((r,i)=>{const p=P(t,r[3]-.15,.5);h+=`<div class=abs style="left:56px;right:56px;top:${420+i*300}px;opacity:${cl((t-r[3]+.2)/.15)}">
  <div class=mono style="font-size:30px;color:${i==2?'#FFC93C':'#F4EFE6'}">${r[0]}</div>
  <div style="display:flex;align-items:center;gap:24px;margin-top:10px"><div style="height:110px;width:${p*r[2]*80}px;background:${i==2?'#FF6B4A':'#F4EFE6'};border:5px solid #002E34;border-radius:14px;box-shadow:8px 8px 0 #002E34"></div><div class=disp style="font-size:${i==2?110:90}px;color:${i==2?'#FFC93C':'#fff'};white-space:nowrap">${r[1]}</div></div></div>`});
 const same=has('I1')&&t>SS['I1']-.1&&t<SE['I1']+.6;
 return `${BG(t)}<div class="abs disp" style="left:56px;top:200px;font-size:130px;color:#F4EFE6;text-shadow:8px 8px 0 #002E34">Watch it move</div>${h}
 ${same?`<div class=abs style="right:50px;top:1010px;transform:rotate(6deg);${pop(t,SS['I1'])}"><span class=disp style="font-size:80px;background:#FFC93C;color:#002E34;padding:4px 20px;border:6px solid #002E34">Same year!</span></div>`:''}`}]);
SC.push(['J','A',t=>{const j2=SS['J2']??99;return `<div class=abs style="left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(0,30,34,.85),transparent)"></div>
 <div class=abs style="left:0;right:0;top:190px;text-align:center;${pop(t,SS['J'])}"><span class=disp style="display:inline-block;font-size:92px;background:#F4EFE6;color:#00525C;padding:6px 24px;rotate:-2deg">Google sees something?</span></div>
 ${t>j2-.1?`<div class=abs style="left:0;right:0;top:340px;text-align:center;${pop(t,j2-.1)}"><span class=disp style="display:inline-block;font-size:92px;background:#FF6B4A;color:#fff;padding:6px 24px;rotate:2deg">or just impatient?</span></div>`:''}`}]);
SC.push(['K','B',t=>{const k2=SS['K2']??99;return `${BG(t)}
 <div class="abs mono" style="left:56px;top:190px;font-size:30px;letter-spacing:4px;color:#FFC93C">WHAT'S COMING FIRST</div>
 <div class="abs disp" style="left:56px;right:56px;top:240px;font-size:150px;color:#F4EFE6;text-shadow:8px 8px 0 #002E34;${pop(t,W('science','K')-.1)}">Big wins in science</div>
 ${t>k2?`<div class="abs card" style="left:56px;right:56px;top:640px;padding:34px 40px;${pop(t,W('medicines','K2')-.1)}"><div class=mono style="font-size:26px">NEW MEDICINES</div>
  <div style="display:flex;align-items:center;gap:20px;margin-top:10px"><span class=disp style="font-size:100px;color:#999;text-decoration:line-through;text-decoration-color:#FF6B4A;text-decoration-thickness:10px">~10 years</span><span class=disp style="font-size:70px">&rarr;</span><span class=disp style="font-size:110px;background:#FF6B4A;color:#fff;padding:0 16px;opacity:${P(t,W('months,','K2')-.1)}">months</span></div>
  <div class=mono style="font-size:20px;margin-top:14px;color:#555">His hope for drug discovery, not a promise</div></div>`:''}`}]);
SC.push(['L','A',t=>`<div class=abs style="left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,rgba(0,30,34,.85),transparent)"></div>
 <div class=abs style="left:0;right:0;top:200px;text-align:center;${pop(t,SS['L'])}"><span class=disp style="display:inline-block;font-size:110px;background:#FFC93C;color:#002E34;padding:6px 26px">What's in it for you?</span></div>`]);
const ROLE=(t,t0,role,line,sub,col)=>`${BG(t)}
 <div class="abs mono" style="left:56px;top:200px;font-size:30px;letter-spacing:4px;color:#FFC93C">IF YOU'RE A...</div>
 <div class="abs disp" style="left:56px;top:250px;font-size:${role.length>10?140:190}px;color:${col};text-shadow:10px 10px 0 #002E34;${pop(t,t0)}">${role}</div>
 <div class="abs card" style="left:56px;right:56px;top:560px;padding:36px 42px;${rise(t,t0+.6)}"><div class=disp style="font-size:96px">${line}</div>${sub?`<div style="font-size:40px;margin-top:16px">${sub}</div>`:''}</div>`;
SC.push(['M','B',t=>ROLE(t,SS['M'],'Developer','Directing AI agents &gt; typing code','',  '#F4EFE6')]);
SC.push(['N','B',t=>ROLE(t,SS['N'],'AI researcher','Safety + testing = the big need',t>(SS['N2']??99)-.2?'<b>Learn:</b> how to measure what models can really do':'','#FFC93C')]);
SC.push(['O','A',t=>{const s=SS['O'],y=W('2028,','O');return `<div class=abs style="left:0;right:0;top:0;height:660px;background:linear-gradient(180deg,rgba(0,30,34,.85),transparent)"></div>
 <div class=abs style="left:0;right:0;top:180px;text-align:center;${pop(t,s)}"><span class=chip style="background:#F4EFE6;color:#00525C;font-size:34px">SCREENSHOT THIS</span></div>
 ${t>y-.2?`<div class=abs style="left:0;right:0;top:260px;text-align:center;${pop(t,y-.2)}"><span class=disp style="display:inline-block;font-size:250px;color:#FFC93C;text-shadow:12px 12px 0 #002E34;rotate:-4deg">2028</span></div>`:''}`}]);
SC.push(['P','A',t=>{const s=SS['P'];const ys=['2027','2028','2030','2035','NEVER'];return `<div class=abs style="left:0;right:0;top:0;height:660px;background:linear-gradient(180deg,rgba(0,30,34,.85),transparent)"></div>
 <div class=abs style="left:50px;right:50px;top:180px;background:#fff;color:#111;border-radius:28px;padding:24px 30px;box-shadow:0 20px 50px rgba(0,0,0,.35);${pop(t,s)}">
  <div class=mono style="font-size:24px;color:#666">COMMENT THE YEAR AGI SHOWS UP</div>
  <div style="display:flex;gap:12px;margin-top:14px;flex-wrap:wrap">${ys.map((y,i)=>`<span class=disp style="font-size:60px;background:${i==1?'#FF6B4A':'#F4EFE6'};color:${i==1?'#fff':'#00525C'};padding:4px 18px;border-radius:14px;opacity:${P(t,s+.2+i*.15)}">${y}</span>`).join('')}</div></div>
 <div class=abs style="left:0;right:0;top:470px;text-align:center;opacity:${P(t,s+1.2)}"><span class=chip style="background:#00525C;color:#fff">FOLLOW @THEAIKHABARI</span></div>`}]);
const active=SC.filter(s=>has(s[0])).map(s=>[SS[s[0]]-.12,s[1],s[2]]);
window.BINT=()=>active.map((s,i)=>[s[0],(active[i+1]||[TOTAL])[0],s[1]]).filter(x=>x[2]==="B");
function setT(t){
 let cur=active[0];for(const s of active) if(t>=s[0]) cur=s;
 const isB=cur[1]==='B',lt=t-cur[0],inP=eo(lt/.25);
 document.getElementById('stage').innerHTML=isB?`<div class=abs style="inset:0;transform:translateY(${(1-inP)*120}px);opacity:${cl(lt/.12)}">${cur[2](t)}</div>`:cur[2](t);
 // whoosh flash on scene change
 document.getElementById('ov').innerHTML=lt<.1&&cur[0]>0?`<div class=abs style="inset:0;background:#fff;opacity:${.35*(1-lt/.1)}"></div>`:'';
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 document.getElementById('brand').innerHTML=`<span style="color:#FF6B4A">&#9679;</span> THE AI KHABARI`;
 const i=WD.findIndex(w=>t>=w.s-.02&&t<w.e+.12);const cap=document.getElementById('cap');
 if(i<0){cap.innerHTML='';return}
 // chunk: groups of up to 3 words, breaking after punctuation or when the scene/seg changes
 const G=window.__G||(window.__G=(()=>{const gs=[];let cur=[];WD.forEach((w,k)=>{if(cur.length&&(cur.length>=3||WD[k-1].seg!==w.seg||/[.,?!]$/.test(WD[k-1].w))){gs.push(cur);cur=[]}cur.push(k)});if(cur.length)gs.push(cur);return gs})());
 const grp=G.find(g=>g.includes(i));
 const hot=w=>/^(agi|2|3|5|10|2025|2026|2028|nobel|google|deepmind|chatgpt|tool|co-worker|months|developer|researcher|safety|stupid|screenshot|comment)/i.test(nm(w));
 cap.innerHTML=grp.map(k=>{const w=WD[k],on=k===i;const txt=w.w.replace(/,$/,'');return `<span style="${on?'background:#FF6B4A;color:#fff;transform:scale(1.08)':(hot(w.w)?'color:#FFC93C':'color:#fff')}">${txt}</span>`}).join(' ');
}
setT(0);
</script></body></html>
