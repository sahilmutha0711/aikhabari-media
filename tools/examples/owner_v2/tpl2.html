<!doctype html><html><head><meta charset="utf-8"><style>

<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__DIR__/demis_cut.png"></div>

<div id="deco"></div><div id="vis"></div><div id="frames"></div><div id="hdr"></div><div id="cap"></div><div id="prog" class="abs" style="left:0;top:0;height:7px;background:#FF6B4A"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__',MODE='__MODE__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$'-]/g,'');
function W(word,seg,k=0){const c=WD.filter(w=>w.seg===seg&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:999}
const P=(t,t0,d=.35)=>eo((t-t0)/d),B=(t,t0,d=.45)=>eb((t-t0)/d);
const rise=(t,t0,dy=50)=>{const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`};
const pop=(t,t0)=>{const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`};
const BOX=(s,bg,fg)=>`<span style="background:${bg};color:${fg};padding:0 14px">${s}</span>`;
const TEAL='#00525C',DEEP='#002E34',CORAL='#FF6B4A',CREAM='#F4EFE6',GOLD='#FFC93C';
// layout
const BOXR=MODE==='split'?{x:50,y:180,w:980,h:760}:{x:50,y:300,w:980,h:760};
const VID=MODE==='split'?{x:50,y:1120,w:980,h:730}:null;

const CLIPS=[[9.8,12.45,'AlphaFold, the AI behind his 2024 Nobel Prize in Chemistry','Video: Jumper et al., Nature 2021 / CC BY 4.0'],[24.0,31.75,'A self-driving lab: robots running science experiments','Video: Szymanski et al. / CC BY 4.0'],[54.4,58.6,'An AlphaFold protein prediction','Video: EMBL-EBI AlphaFold / CC BY 4.0'],[58.6,63.75,'Medicine research','Video: yourgenome / CC BY 3.0'],[65.4,71.35,'AI agents doing the hands-on work','Video: Szymanski et al. / CC BY 4.0']];
const clipAt=t=>CLIPS.find(c=>t>=c[0]&&t<c[1]);
const rr=(x,y,w,h,r)=>`M${x+r},${y}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}v${h-2*r}a${r},${r} 0 0 1 -${r},${r}h-${w-2*r}a${r},${r} 0 0 1 -${r},-${r}v-${h-2*r}a${r},${r} 0 0 1 ${r},-${r}z`;
// visual content inside the box (local coords w x h)
function VIS(key,t){const w=BOXR.w,h=BOXR.h;
 const card=(inner,bg=CREAM)=>`<div class=abs style="inset:0;background:${bg};border-radius:34px;overflow:hidden">${inner}</div>`;
 switch(key){
 case 'hook':{const s2=W("i'm",'A2');return card(`<div class=abs style="inset:0;background:${DEEP}"></div><div class=abs style="right:-120px;top:-120px;width:480px;height:480px;border-radius:50%;background:${TEAL}"></div>

 case 'demis':{if(clipAt(t))return '';return card(`<div class=abs style="inset:0;background:${TEAL}"></div><div class=abs style="right:-100px;top:200px;width:620px;height:620px;border-radius:50%;background:${CREAM}"></div>

 case 'tool':{const g=W('chatgpt,','D'),p=W('performs','D');return card(`<div class="abs mono" style="left:50px;top:50px;font-size:30px;letter-spacing:4px;color:${CORAL}">SO WHAT IS AGI?</div>

  <div class="abs mono" style="left:50px;top:60px;font-size:30px;letter-spacing:4px;color:${GOLD}">SO EITHER...</div>
  <div class=abs style="left:50px;right:50px;top:140px;background:${CREAM};color:${TEAL};border-radius:26px;padding:34px 36px;${pop(t,W('either','J'))}"><div class=disp style="font-size:96px">Google sees something we can't</div></div>
  <div class="abs disp" style="left:0;right:0;top:450px;text-align:center;font-size:70px;color:${CREAM};opacity:${P(t,j2-.2)}">or</div>

 case 'foryou':return card(`<div class=abs style="inset:0;background:${GOLD}"></div><div class="abs disp" style="left:50px;right:50px;top:150px;font-size:170px;color:${DEEP};${pop(t,W("what's",'L'))}">What's in it for you?</div>`,GOLD);

  <div class=abs style="left:50px;right:50px;top:530px;background:${CORAL};color:#fff;border-radius:26px;padding:26px 36px;${t>n2-.1?rise(t,n2-.1):'opacity:0'}"><div class=mono style="font-size:24px">LEARN</div><div style="font-size:46px;margin-top:6px">How to measure what models can really do</div></div>`)}

  <div class="abs disp" style="left:0;right:0;top:540px;text-align:center;font-size:84px;color:${CREAM};opacity:${P(t,W('look','O')-.2)}">One of us will look very stupid</div>`,DEEP)}
 case 'comment':{const s=W('comment','P');const ys=['2027','2028','2030','2035','NEVER'];return card(`<div class="abs disp" style="left:50px;right:50px;top:70px;font-size:120px;color:${DEEP}">When does AGI show up?</div>

  <div class=abs style="left:50px;top:640px;opacity:${P(t,s+1)}"><span class=chip style="background:${TEAL};color:#fff">COMMENT YOUR YEAR &middot; FOLLOW @THEAIKHABARI</span></div>`)}
 }return ''}

function CLIPLABEL(t){const c=clipAt(t);if(!c)return '';const k=CLIPS.indexOf(c);let top='';
 if(k===1){const tx=W('taxes,','E'),sc=W('science','E');top=`<div class=abs style="left:30px;top:30px;right:30px"><span class=disp style="font-size:80px;background:${CORAL};color:#fff;padding:2px 18px">AGI = a coworker who learns any job</span></div>
  <div class=abs style="left:30px;bottom:90px;display:flex;gap:14px"><span class=chip style="background:#fff;color:${DEEP};font-size:34px;opacity:${P(t,tx-.1)}">your taxes</span><span class=chip style="background:#fff;color:${DEEP};font-size:34px;opacity:${P(t,sc-.1)}">&rarr; science experiments</span></div>`}
 if(k===0)top=`<div class=abs style="left:30px;top:30px"><span class=disp style="font-size:84px;background:${GOLD};color:${DEEP};padding:2px 18px">Nobel Prize 2024 &middot; Chemistry</span></div>`;
 if(k===2)top=`<div class=abs style="left:30px;top:30px"><span class=disp style="font-size:84px;background:${CORAL};color:#fff;padding:2px 18px">First big wins: science</span></div>`;
 if(k===3){const m=W('months,','K2');top=`<div class=abs style="left:30px;top:30px;right:30px"><span class=disp style="font-size:76px;background:${CREAM};color:${DEEP};padding:2px 18px">New medicines: <s style="text-decoration-color:${CORAL};text-decoration-thickness:8px">~10 years</s> ${t>m-.1?BOX('months',CORAL,'#fff'):''}</span></div>`}

 return `${top}<div class=abs style="left:30px;bottom:24px;font-family:Mono;font-size:20px;color:#fff;background:rgba(0,0,0,.55);padding:4px 10px">${c[2]} &middot; ${c[3]}</div>`}
function setT(t){

 const aFull=MODE==='full'&&typ==='A';

 if(MODE==='split'){holes+=rr(VID.x,VID.y,VID.w,VID.h,36); if(clip) holes+=rr(BOXR.x,BOXR.y,BOXR.w,BOXR.h,34);}

 const full='M0,0H1080V1920H0Z';
 document.getElementById('bgg').innerHTML=aFull?'':`<path d="${full} ${holes}" fill="${TEAL}" fill-rule="evenodd"/><path d="${full} ${holes}" fill="url(#dots)" fill-rule="evenodd"/>`;
 // deco shapes (behind boxes, outside holes)

 if(!aFull){deco=MODE==='split'?`<div class=abs style="left:-120px;top:1858px;width:1400px;height:200px;background:${CORAL};transform:rotate(-2deg)"></div><div class=abs style="right:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:26px solid ${GOLD};opacity:.9"></div>`:`<div class=abs style="left:-140px;top:1110px;width:300px;height:300px;border-radius:50%;background:${CORAL};opacity:.95"></div><div class=abs style="right:-110px;top:120px;width:260px;height:260px;border-radius:50%;border:26px solid ${GOLD};opacity:.9"></div>`;
  if(MODE==='full') deco+=`<div class=abs style="left:-200px;top:1700px;width:1500px;height:400px;background:${CORAL};transform:rotate(-4deg)"></div>`;}

 // visual box
 let v='';
 if(MODE==='split'||!aFull){
