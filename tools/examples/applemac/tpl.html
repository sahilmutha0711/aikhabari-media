<!doctype html><html><head><meta charset="utf-8"><style>

*{margin:0;padding:0;box-sizing:border-box}html,body{background:transparent}
body{width:1080px;height:1920px;overflow:hidden;font-family:Sans;color:#fff;position:relative}
.abs{position:absolute}
.chip{display:inline-block;font-family:Mono;font-weight:700;letter-spacing:3px;border-radius:40px;padding:10px 22px;font-size:26px;background:var(--acc);color:var(--ink)}
.chipg{display:inline-block;font-family:Mono;font-weight:700;letter-spacing:3px;border-radius:40px;padding:10px 22px;font-size:26px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff}
.h{font-family:Disp;line-height:1.0;letter-spacing:-2px;white-space:normal;max-width:1000px}
.stk{display:inline-block;white-space:normal;max-width:960px;background:#fff;color:#0b0b0d;border-radius:26px;padding:14px 30px;font-family:Disp;box-shadow:0 16px 44px rgba(0,0,0,.4);line-height:1.08}
.glass{background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(18px);border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#cap{position:absolute;left:40px;right:40px;text-align:center;font-family:Sans;font-weight:700;line-height:1.15;font-size:66px}
#cap span{display:inline-block;padding:2px 14px;border-radius:16px;margin:0 3px;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.55)}
</style></head><body><div id="stage"></div><div id="cap"></div>
<div id="prog" class="abs" style="left:0;top:0;height:8px"></div>
<script>
const G=__GROUPS__,TOTAL=__TOTAL__,PAL='__PAL__',A='file:///home/claude/reels/mac/a/';
const P=PAL==='noir'?{acc:'#F2C46D',acc2:'#FFF1CF',ink:'#14100A',grad:'linear-gradient(100deg,#FFF6E0,#F2C46D 45%,#C8924A)',glow:'rgba(242,196,109,.55)',dim:'rgba(10,9,8,.72)'}
 :{acc:'#7DFFB8',acc2:'#D9FFE9',ink:'#03140F',grad:'linear-gradient(100deg,#E9FFF3,#7DFFB8 45%,#2FD1C0)',glow:'rgba(125,255,184,.5)',dim:'rgba(2,20,16,.72)'};
document.body.style.setProperty('--acc',P.acc);document.body.style.setProperty('--ink',P.ink);document.body.style.setProperty('--grad',P.grad);
document.getElementById('prog').style.background=P.grad;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(t,t0)=>{const p=eb((t-t0)/.5);return `opacity:${cl((t-t0)/.12)};transform:scale(${.72+.28*p}) rotate(${(1-p)*-3}deg)`};
const rise=(t,t0)=>{const p=eo((t-t0)/.5);return `opacity:${cl((t-t0)/.25)};transform:translateY(${(1-p)*70}px);filter:blur(${(1-p)*10}px)`};

const onClip=t=>CLIPS.some(([a,b])=>t>=a&&t<b);
const CARD='left:40px;top:520px;width:1000px;height:720px';
function frame(t,t0){const p=eo((t-t0)/.5);return `<div class=abs style="${CARD};border-radius:48px;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 30px 90px rgba(0,0,0,.6),0 0 60px ${P.glow};opacity:${p}"></div>`}
function head(t,t0,chip,html,size=104){return `<div class=abs style="left:44px;right:44px;top:180px;${rise(t,t0)}"><span class=chip>${chip}</span></div>
 <div class="abs h" style="left:44px;right:44px;top:250px;font-size:${size}px;${rise(t,t0+.12)}">${html}</div>`}
function pill(t,t0,html,top=1270){return `<div class=abs style="left:44px;right:44px;top:${top}px;text-align:center;${pop(t,t0)}"><span class="glass" style="display:inline-block;padding:16px 30px;font-family:Disp;font-size:44px;background:${P.dim}">${html}</span></div>`}
const credit=t=>onClip(t)?`<div class=abs style="right:56px;top:1210px;font-family:Mono;font-size:18px;color:rgba(255,255,255,.75)">Footage: Apple</div>`:'';
function stamp(t,t0,txt,top,rot=-6){const p=eb((t-t0)/.45);return `<div class=abs style="left:0;right:0;top:${top}px;text-align:center;opacity:${cl((t-t0)/.1)};transform:scale(${2.2-1.2*p}) rotate(${rot}deg)"><span style="display:inline-block;border:8px solid ${P.acc};color:${P.acc};border-radius:22px;padding:6px 30px;font-family:Disp;font-size:84px;background:rgba(0,0,0,.55)">${txt}</span></div>`}
const SC=[
 [0,t=>{let h=`<div class=abs style="left:44px;right:44px;top:150px;${pop(t,.05)}"><span class=stk style="font-size:62px">Apple's <span style="background:${P.ink};color:${P.acc};padding:0 14px;border-radius:14px">FIRST</span> touchscreen Mac</span></div>`;
   if(t>4.3&&t<10.45){h+=`<div class="abs glass" style="left:60px;right:60px;top:1110px;padding:26px;display:flex;gap:26px;align-items:center;background:${P.dim};${rise(t,4.3)}">
     <div style="width:170px;height:170px;flex:none;border-radius:85px;background:url('${A}jobs.jpg') 50% 30%/cover;border:4px solid ${P.acc}"></div>
     <div><div style="font-family:Mono;font-size:24px;letter-spacing:3px;color:${P.acc}">STEVE JOBS · 2010</div>
     <div style="font-family:Ser;font-size:50px;line-height:1.05;margin-top:8px">"...your arm wants to fall off."</div>
     <div style="font-family:Mono;font-size:16px;color:rgba(255,255,255,.6);margin-top:8px">Photo: Matthew Yohe, CC BY-SA 3.0</div></div></div>`}
   if(t>10.56)h+=`<div class=abs style="left:0;right:0;top:1150px;text-align:center;${pop(t,10.6)}"><span class=chip style="font-size:40px;padding:14px 34px">OLD vs NEW &darr;</span></div>`;
   return h}],
 [12.95,t=>head(t,12.95,'OLD MACBOOK PRO',`Could <span class=grad>never</span> be touched.`)+frame(t,12.95)+(t>15.3?stamp(t,15.3,'NO TOUCH',820):'')],
 [16.35,t=>head(t,16.35,'NEW &middot; 01 TOUCHSCREEN',`Now you can <span class=grad>touch it.</span>`,90)+frame(t,16.35)+(t>18.4?pill(t,18.4,`Many apps work with touch <span style="color:${P.acc}">from day one</span>`):'')],
 [22.6,t=>head(t,22.6,'NEW &middot; 02 DYNAMIC ISLAND',`The notch is <span class=grad>gone.</span>`)+frame(t,22.6)],
 [24.6,t=>{const m=eo((t-26.6)/0.9);const exp=eo((t-30.0)/0.6);const wNotch=220+(1-m)*0;const w=m<=0?220:220+m*120+exp*300,hgt=m<=0?60:52+exp*58,top=m<=0?0:18,r=m<=0?'0 0 30px 30px':`${hgt/2}px`;
   const siri=t>31.15,spot=t>31.9;
   let inner='';if(spot)inner=`<div style="display:flex;align-items:center;gap:16px;padding:0 26px;height:100%;font-family:Sans;font-size:32px;color:#ddd;${rise(t,31.9)}"><span style="width:26px;height:26px;border:4px solid #bbb;border-radius:50%;display:inline-block"></span>Spotlight Search</div>`;
   else if(siri)inner=`<div style="height:100%;display:flex;align-items:center;justify-content:center;gap:16px;font-family:Sans;font-size:34px;${rise(t,31.15)}"><span style="width:40px;height:40px;border-radius:50%;background:conic-gradient(from ${t*200}deg,#ff5f9e,#ffb35c,#5cf2ff,#a46bff,#ff5f9e);box-shadow:0 0 30px #a46bff"></span>Siri</div>`;
   return head(t,24.6,'NEW &middot; 02 DYNAMIC ISLAND',`Notch &rarr; <span class=grad>Dynamic Island</span>`,96)+
   `<div class=abs style="left:60px;top:560px;width:960px;height:640px;border-radius:40px;background:linear-gradient(160deg,#16161a,#060607);border:10px solid #2b2b30;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 70px ${P.glow};overflow:hidden;${rise(t,24.6)}">
     <div style="position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 110%,${P.glow},transparent 70%);opacity:.6"></div>
     <div style="position:absolute;left:50%;top:${top}px;transform:translateX(-50%);width:${w}px;height:${hgt}px;border-radius:${r};background:#000;box-shadow:${m>0?'0 0 0 2px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.7)':'none'};overflow:hidden">${inner}</div>
     ${m<=0?`<div style="position:absolute;left:0;right:0;top:120px;text-align:center;font-family:Mono;font-size:30px;color:rgba(255,255,255,.7);letter-spacing:3px">OLD: THE NOTCH</div>`:''}
     ${t>28.1?`<div style="position:absolute;right:50px;bottom:40px;width:150px;height:300px;border-radius:34px;border:6px solid #3a3a40;background:#0b0b0d;${pop(t,28.1)}"><div style="position:absolute;left:50%;top:12px;transform:translateX(-50%);width:60px;height:18px;border-radius:9px;background:#000;border:1px solid #333"></div><div style="position:absolute;bottom:-50px;left:-20px;right:-20px;text-align:center;font-family:Mono;font-size:20px;color:${P.acc}">LIKE iPHONE</div></div>`:''}
   </div>`}],
 [33.3,t=>head(t,33.3,'NEW &middot; 03 DISPLAY',`<span style="${t>35.6?'text-decoration:line-through;text-decoration-thickness:8px;opacity:.55':''}">Mini-LED</span> &rarr; <span class=grad style="opacity:${cl((t-36.3)/.2)}">OLED</span>`)+frame(t,33.3)],
 [36.9,t=>head(t,36.9,'NEW &middot; 03 DISPLAY',`Apple calls it <span class=grad>PROLED XDR</span>`,96)+frame(t,36.9)+(t>38.2?pill(t,38.2,`10,000,000 : 1 contrast`):'')],
 [40.6,t=>head(t,40.6,'NEW &middot; 04 DESIGN',`And it's <span class=grad>thinner.</span>`)+frame(t,40.6)+(t>41.9?(()=>{const p=eo((t-41.9)/.8);return `<div class=abs style="left:190px;right:190px;top:1290px;${rise(t,41.9)}"><div style="height:${34-14*p}px;border-radius:12px;background:${P.grad};margin:0 auto;width:100%"></div><div style="text-align:center;font-family:Mono;font-size:24px;margin-top:12px;color:rgba(255,255,255,.8)">OLD &rarr; NEW</div></div>`})():'')],
 [43.2,t=>head(t,43.2,'NEW &middot; 04 DESIGN',`16-inch: <span class=grad>~&#8531; kilo lighter</span>`,94)+frame(t,43.2)+(t>45.6?pill(t,45.6,`<span style="color:${P.acc}">&minus;0.7 lb</span> vs the old 16-inch`):'')],
 [47.7,t=>{const f=cl((t-50.2)/2.0)*50,mins=Math.round(cl((t-50.2)/2.0)*30);
   return head(t,47.7,'NEW &middot; 05 CHARGING',`<span class=grad>50%</span> in about 30 min`,100)+(t<48.9?frame(t,47.7):'')+
   (t>=48.9?`<div class=abs style="left:150px;top:640px;width:700px;height:330px;border-radius:60px;border:12px solid #fff;padding:18px;${pop(t,48.9)}"><div style="height:100%;width:${f*2}%;border-radius:34px;background:${P.grad};box-shadow:0 0 50px ${P.glow}"></div></div><div class=abs style="left:860px;top:745px;width:44px;height:120px;border-radius:0 18px 18px 0;background:#fff;${pop(t,48.9)}"></div>
   <div class=abs style="left:0;right:0;top:1010px;text-align:center;font-family:Disp;font-size:150px;letter-spacing:-4px;${pop(t,48.95)}">${Math.round(f)}%</div>
   <div class=abs style="left:0;right:0;top:1180px;text-align:center;${pop(t,49.2)}"><span class=chipg style="font-size:34px">&#9201; ${String(mins).padStart(2,'0')}:00 MIN</span></div>`:'')}],
 [53.2,t=>`<div class=abs style="left:0;right:0;top:150px;text-align:center;${pop(t,53.25)}"><span class=stk style="font-size:72px;background:${P.acc};color:${P.ink}">But here's the twist</span></div>`+
   (t>55.85?`<div class=abs style="left:0;right:0;top:300px;text-align:center;${pop(t,55.85)}"><span class="glass" style="display:inline-block;padding:16px 34px;font-family:Disp;font-size:54px;background:${P.dim}">NEW <span class=grad>M6 chip</span> this week</span></div>`:'')+
   (t>58.6?stamp(t,58.6,'NOT IN THIS MAC',1150,-5):'')],
 [59.9,t=>head(t,59.9,'THE CHIP',`Same <span class=grad>M5 Pro</span> as the old one`,96)+frame(t,59.9)+(t>61.2?pill(t,61.2,`M6 <span style="color:${P.acc}">&#10007;</span> &nbsp; M5 Pro / M5 Max <span style="color:${P.acc}">&#10003;</span>`):'')],
 [63.6,t=>{const o=cl((t-65.3)/1.2),n=cl((t-70.45)/1.2);const num=(a,b,p)=>'$'+Math.round(a+(b-a)*eo(p)).toLocaleString('en-US');
   return head(t,63.6,'THE PRICE &middot; 14-INCH',`Same chip. <span class=grad>New price.</span>`,96)+
   `<div class="abs glass" style="left:60px;right:60px;top:560px;padding:36px 44px;background:${P.dim};${rise(t,63.8)}"><div style="font-family:Mono;font-size:28px;letter-spacing:3px;color:rgba(255,255,255,.7)">OLD MACBOOK PRO</div><div style="font-family:Disp;font-size:150px;letter-spacing:-4px;opacity:${t>70.4?.55:1}">${num(0,2499,o)}</div></div>`+
   (t>69.1?`<div class="abs glass" style="left:60px;right:60px;top:880px;padding:36px 44px;background:${P.dim};border-color:${P.acc};box-shadow:0 0 70px ${P.glow};${rise(t,69.1)}"><div style="font-family:Mono;font-size:28px;letter-spacing:3px;color:${P.acc}">NEW &middot; TOUCH + OLED</div><div class=grad style="font-family:Disp;font-size:150px;letter-spacing:-4px">${num(2499,2899,n)}</div></div>`:'')+
   (t>71.7?stamp(t,71.7,'+$400',1215,-4):'')}],
 [72.9,t=>`<div class=abs style="left:44px;right:44px;top:150px;${pop(t,73.1)}"><span class=stk style="font-size:66px">Would you pay <span style="background:${P.ink};color:${P.acc};padding:0 14px;border-radius:14px">$400 more</span> just to touch your Mac?</span></div>`+
   (t>77.3?`<div class=abs style="left:0;right:0;top:1180px;display:flex;gap:40px;justify-content:center;${pop(t,77.3)}"><span class=stk style="font-size:80px;background:${P.acc};color:${P.ink}">YES</span><span class=stk style="font-size:80px">NO</span></div><div class=abs style="left:0;right:0;top:1330px;text-align:center;${pop(t,77.5)}"><span class=chipg style="font-size:34px">COMMENT &darr;</span></div>`:'')],
];
function setT(t){
 let i=SC.length-1;while(i>0&&t<SC[i][0])i--;
 let h=SC[i][1](t)+credit(t);
 h+=`<div class=abs style="left:44px;bottom:60px;font-family:Mono;font-size:22px;letter-spacing:4px;color:rgba(255,255,255,.8)">&#9679; THE AI KHABARI</div>`;
 document.getElementById('stage').innerHTML=h;
 const g=G.find(g=>t>=g[0][0]-0.05&&t<(g[g.length-1][1]+0.25))||null;
 const cap=document.getElementById('cap');
 if(g){const k=g.reduce((a,w,j)=>t>=w[0]?j:a,-1);cap.style.top=(isA(t)?1560:1400)+'px';
  cap.innerHTML=g.map((w,j)=>`<span style="${j===k?`background:${P.acc};color:${P.ink};-webkit-text-stroke:0`:'color:#fff'}">${w[2]}</span>`).join(' ')}
 else cap.innerHTML='';
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
}
setT(0);
</script></body></html>
