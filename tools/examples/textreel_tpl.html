<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:Mono;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
:root{--ink:#07080C;--cream:#FFFFFF;--acc:#00E5FF;--red:#FF3D6E;--dim:#C9CCD6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#07080C}
body{width:1080px;height:1920px;overflow:hidden;font-family:Sans;color:var(--cream);position:relative}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.abs{position:absolute}
.disp{font-family:Disp;line-height:1.0;letter-spacing:0;text-transform:uppercase}
.ser{font-family:Ser;line-height:1.05}
.mono{font-family:Mono}
#grain{position:absolute;inset:-50px;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#brand{position:absolute;left:64px;top:92px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#prog{position:absolute;left:0;top:0;height:8px;background:#fff}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Sans;font-weight:700;font-size:64px;line-height:1.15}
#cap span{padding:2px 12px;border-radius:10px;margin:0 2px;display:inline-block}
.chip{display:inline-block;padding:14px 32px;border-radius:60px;font-family:Mono;font-weight:700;font-size:32px;letter-spacing:2px}
.tag{font-family:Mono;font-size:20px;letter-spacing:3px;color:#fff;border:1px solid rgba(255,255,255,.5);padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.25)}
.box{background:#fff;color:#07080C;padding:0 18px}
.fig{position:absolute;width:300px;height:380px}
.fig .h{position:absolute;left:85px;top:0;width:130px;height:150px;border-radius:65px 65px 60px 60px}
.fig .b{position:absolute;left:0;top:165px;width:300px;height:215px;border-radius:150px 150px 20px 20px}
</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__DIR__/demis_cut.png"><img src="__OWLDIR__/point.png"></div>
<div id="cam"><div id="stage"></div></div>
<svg id="grain" width="1180" height="2020"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig"></div><div id="ov"></div><div id="prog"></div><div id="brand"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const L=[];WD.forEach(w=>{if(L[w.line]===undefined)L[w.line]=w.s});L.push(TOTAL);
function W(word,line,k=0){const c=WD.filter(w=>w.line===line&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:L[line]}
const P=(t,t0,d=.35)=>eo((t-t0)/d), B=(t,t0,d=.45)=>eb((t-t0)/d);
function typed(str,t,t0,cps=38){const n=Math.floor(cl((t-t0)*cps,0,str.length));return str.slice(0,n)+(t>t0&&n<str.length&&Math.floor(t*4)%2?'▍':'')}
function rise(t,t0,dy=60){const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`}
function pop(t,t0){const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`}
const PAL={sun:['#FF4D2E','#FF2E63','#FF9500','#FF6F91'],sea:['#0047E0','#00D4FF','#0020A0','#00F0C0'],neon:['#07080C','rgba(0,229,255,.38)','rgba(255,61,110,.38)','rgba(0,87,255,.35)'],alert:['#D10028','#FF3D6E','#FF6A00','#8A0018']};
function MESH(t,k){const c=PAL[k],a=t*.35;const g=(i,x,y,r)=>`radial-gradient(${r}px ${r}px at ${x}% ${y}%,${c[i]},transparent 70%)`;
 return `<div class=abs style="inset:-300px 0 0 0;background:${g(1,30+20*Math.sin(a),25+15*Math.cos(a*1.3),900)},${g(2,75+15*Math.cos(a*.9),70+15*Math.sin(a*1.1),1000)},${g(3,50+30*Math.sin(a*.7+2),95+10*Math.cos(a),800)},${c[0]}"></div>`}
const DUO=(o=.85,a='#FF3D6E',b='#FF8A00')=>`<div class=abs style="inset:0;background:linear-gradient(160deg,${a},${b});mix-blend-mode:color;opacity:${o}"></div>`;
const BOX=(s,bg='#fff',fg='#07080C')=>`<span style="background:${bg};color:${fg};padding:0 18px">${s}</span>`;
// glitchy AI avatar silhouette
function AVA(t,x,y,s=1,col='#00E5FF'){const j=Math.sin(t*37)>0.85?((t*997)%14-7):0;let lines='';for(let i=0;i<24;i++){lines+=`<div style="position:absolute;left:0;right:0;top:${i*16}px;height:3px;background:rgba(255,255,255,.12)"></div>`}
 return `<div class=fig style="left:${x}px;top:${y}px;transform:scale(${s}) translateX(${j}px);filter:drop-shadow(0 0 30px ${col})"><div class=h style="background:${col};opacity:.9"></div><div class=b style="background:${col};opacity:.9"></div><div class=abs style="inset:0;overflow:hidden">${lines}</div><div class="abs mono" style="left:0;right:0;top:250px;text-align:center;font-size:44px;font-weight:700;color:#07080C">AI</div></div>`}
const K='__OWLDIR__';const fmt=n=>Math.round(n).toLocaleString('en-US');
const lt=(t,i)=>t-L[i];
// voxel field: generic cubes (no game assets)
function CUBES(t,col1='#3BD16F',col2='#2A9D55'){let h='';for(let i=0;i<18;i++){const x=(i*173)%1000,y=1100+((i*97)%600),s=60+(i%4)*30,dy=Math.sin(t*1.5+i)*14;
 h+=`<div class=abs style="left:${x}px;top:${y+dy}px;width:${s}px;height:${s}px;background:${i%3?col1:col2};box-shadow:inset -10px -10px 0 rgba(0,0,0,.25);transform:rotate(${(i%5-2)*6}deg);opacity:.85"></div>`}return h}
const S=[];
S[0]=(t)=>`${MESH(t,'neon')}${CUBES(t)}
 <div class=abs style="left:250px;top:${640-eo(t/.5)*20}px;width:620px;height:850px;background:url(${D}/demis_cut.png) center bottom/contain no-repeat;opacity:${P(t,.05,.3)}"></div>
 <div class="abs disp" style="left:40px;right:40px;top:200px;text-align:center;font-size:170px;${pop(t,0)}">4 AI agents</div>
 <div class="abs disp" style="left:0;right:0;top:380px;text-align:center;font-size:150px;${pop(t,.25)}">${BOX('beat Minecraft','#3BD16F','#07080C')}</div>
 <div class="abs mono" style="left:0;right:0;top:1520px;text-align:center;font-size:30px;font-weight:700;opacity:${P(t,.8)}">Google DeepMind, led by Demis Hassabis</div>
 <div class="abs mono" style="left:64px;right:64px;top:1800px;font-size:18px;color:#C9CCD6">Photo: John Sears / CC BY-SA 4.0</div>`;
S[1]=(t)=>`${MESH(t,'sea')}${CUBES(t,'#00F0C0','#00B8FF')}
 <div class="abs disp" style="left:64px;right:64px;top:330px;font-size:140px;${pop(t,L[1])}">The whole game.</div>
 <div class="abs disp" style="left:64px;right:64px;top:560px;font-size:120px;${rise(t,L[1]+.6)}">${BOX('No humans playing.','#fff','#0047E0')}</div>
 <div class="abs ser" style="left:64px;right:64px;top:800px;font-size:80px;${rise(t,L[1]+1.2)}">Random world. One goal: beat the final boss.</div>`;
S[2]=(t)=>{const v=eo(cl(lt(t,2)/1.6));const hh=Math.floor(27*v),mm=Math.floor(14*v);return `${MESH(t,'sun')}
 <div class="abs mono" style="left:0;right:0;top:330px;text-align:center;font-size:40px;font-weight:700;letter-spacing:6px;${rise(t,L[2])}">TIME TO WIN</div>
 <div class="abs disp" style="left:0;right:0;top:420px;text-align:center;font-size:330px">${hh}h ${String(mm).padStart(2,'0')}m</div>
 <div class="abs ser" style="left:0;right:0;top:820px;text-align:center;font-size:80px;${rise(t,L[2]+1.3)}">non-stop, by themselves</div>`};
S[3]=(t)=>{const n=Math.floor(605*eo(cl(lt(t,3)/1.5)));let x='';for(let i=0;i<60;i++)x+=`<div style="width:70px;height:70px;border-radius:10px;background:${i<n/10?'#FF3D6E':'rgba(255,255,255,.12)'};display:flex;align-items:center;justify-content:center;font-family:Disp;font-size:50px">${i<n/10?'×':''}</div>`;
 return `${MESH(t,'alert')}
 <div class="abs disp" style="left:64px;right:64px;top:250px;font-size:150px">They died</div>
 <div class="abs disp" style="left:64px;right:64px;top:400px;font-size:300px">${n}×</div>
 <div class=abs style="left:64px;right:64px;top:780px;display:grid;grid-template-columns:repeat(10,1fr);gap:10px">${x}</div>`};
S[4]=(t)=>{const n=Math.floor(2783*eo(cl(lt(t,4)/1.5)));const code=['bot.dig(block)','await craft("pickaxe")','if (hp < 6) retreat()','share("portal at x:412")','plan.next()','bot.equip(sword)','memory.save(lesson)'];let c='';
 for(let i=0;i<9;i++){c+=`<div style="opacity:${cl((lt(t,4)-i*.15)/.2)}">&gt; ${code[(i+Math.floor(t*3))%code.length]}</div>`}
 return `${MESH(t,'neon')}
 <div class="abs disp" style="left:64px;right:64px;top:250px;font-size:140px">They wrote</div>
 <div class="abs disp" style="left:64px;right:64px;top:390px;font-size:230px;color:#00E5FF">${fmt(n)}</div>
 <div class="abs disp" style="left:64px;right:64px;top:640px;font-size:120px">programs</div>
 <div class="abs mono" style="left:64px;right:64px;top:860px;font-size:38px;line-height:1.5;padding:30px;border-radius:20px;background:#121418;color:#9BF5C0">${c}</div>
 <div class="abs tag" style="right:64px;top:870px">ILLUSTRATION</div>`};
S[5]=(t)=>{const r=[['SUPPLIES','#3BD16F'],['TOOLS','#00E5FF'],['EXPLORING','#FFD84D'],['BOSS PREP','#FF3D6E']];let h='';
 r.forEach(([n,c],i)=>{h+=`<div class=abs style="left:${64+(i%2)*490}px;top:${720+Math.floor(i/2)*230}px;width:460px;height:200px;border-radius:26px;background:${c};color:#07080C;display:flex;flex-direction:column;justify-content:center;padding-left:34px;${pop(t,L[5]+.8+i*.25)}"><div class=mono style="font-size:26px;font-weight:700">AGENT ${i+1}</div><div class=disp style="font-size:80px">${n}</div></div>`});
 return `${MESH(t,'sea')}
 <div class="abs disp" style="left:64px;right:64px;top:250px;font-size:130px;${rise(t,L[5])}">Nobody gave them roles.</div>
 <div class="abs ser" style="left:64px;right:64px;top:540px;font-size:76px;${rise(t,L[5]+.4)}">They split the work in 10 minutes.</div>${h}`};
S[6]=(t)=>`${MESH(t,'sun')}
 <div class="abs mono" style="left:0;right:0;top:420px;text-align:center;font-size:40px;font-weight:700;letter-spacing:6px">TOTAL COST</div>
 <div class="abs disp" style="left:0;right:0;top:500px;text-align:center;font-size:360px;${pop(t,L[6]+.2)}">~$520</div>
 <div class="abs ser" style="left:0;right:0;top:920px;text-align:center;font-size:74px;${rise(t,L[6]+.8)}">less than a new phone</div>
 <div class="abs mono" style="left:64px;right:64px;top:1080px;text-align:center;font-size:26px">at Gemini's intro API pricing (~$1,040 standard)</div>`;
S[7]=(t)=>{const it=['Easy mode','They played through code, not the screen','Real-world jobs? Not proven yet'];let h=`${MESH(t,'alert')}<div class="abs disp" style="left:64px;top:240px;font-size:200px;${pop(t,L[7])}">The catch</div>`;
 it.forEach((x,i)=>{const t0=L[7]+.5+i*.9;h+=`<div class="abs mono" style="left:64px;right:64px;top:${560+i*210}px;font-size:46px;line-height:1.3;padding:28px 32px;border-radius:18px;background:rgba(0,0,0,.3);border:3px solid #fff;opacity:${P(t,t0,.25)}"><b>[!]</b> ${typed(x,t,t0,40)}</div>`});return h};
S[8]=(t)=>`${MESH(t,'neon')}
 <div class="abs chip" style="left:64px;top:260px;background:#3BD16F;color:#07080C;${pop(t,L[8])}">SAY THIS AT WORK</div>
 <div class="abs disp" style="left:64px;right:64px;top:400px;font-size:130px;${rise(t,L[8]+.2)}">The scary part isn't the game.</div>
 <div class="abs ser" style="left:64px;right:64px;top:820px;font-size:100px;color:#3BD16F;${rise(t,L[8]+1.2)}">It's a 27-hour project with no boss.</div>`;
S[9]=(t)=>`${MESH(t,'sea')}
 <div class=abs style="left:60px;right:60px;top:280px;border-radius:34px;background:rgba(255,255,255,.96);color:#07080C;padding:30px 36px;display:flex;align-items:center;gap:28px;${pop(t,L[9])}">
  <svg width=90 height=90 viewBox="0 0 24 24"><path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z" fill="#FF3D6E"/></svg>
  <div><div class=mono style="font-size:26px;font-weight:700;color:#FF3D6E;letter-spacing:2px">SEND THIS TO</div><div class=disp style="font-size:68px">the friend who still hasn't beaten Minecraft</div></div></div>
 <div class="abs chip" style="left:64px;top:720px;background:#fff;color:#0047E0;${pop(t,L[9]+.8)}">FOLLOW @THEAIKHABARI</div>
 <div class=abs style="right:30px;top:${880+Math.sin(t*3)*12}px;width:420px;height:420px;background:url(${K}/point.png) center/contain no-repeat;transform:scaleX(-1);opacity:${P(t,L[9]+.3,.4)}"></div>
 <div class="abs mono" style="left:64px;right:64px;top:1580px;font-size:20px;color:#DDEBFF">Source: Google DeepMind paper (arXiv 2610.22319), Crypto Briefing, TokenPost. Not affiliated with Minecraft or Mojang.</div>`;
function setT(t){
 let i=0;for(let k=0;k<S.length;k++)if(t>=L[k]-.12)i=k;
 const l2=t-(L[i]-.12),inP=eo(l2/.28);
 document.getElementById('stage').innerHTML=`<div class=abs style="inset:0;top:${i>0?190:0}px;transform:translateX(${(1-inP)*140}px);filter:blur(${(1-inP)*14}px)">${S[i](t,l2)}</div>`;
 const beats=[L[2],L[3],L[6]];let pz=0;beats.forEach(b=>{if(t>b&&t<b+.5)pz=Math.max(pz,(1-(t-b)/.5)*.05)});
 document.getElementById('cam').style.transform=`scale(${1+pz+Math.sin(t*.7)*.004}) rotate(${pz*8*Math.sin(t*40)}deg)`;
 document.getElementById('tb').setAttribute('seed',Math.floor(t*24)%97+1);
 document.getElementById('grain').style.transform=`translate(${(t*137)%40-20}px,${(t*91)%40-20}px)`;
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 document.getElementById('brand').innerHTML=`<span style="color:var(--acc)">&#9679;</span> THE AI KHABARI`;
}
setT(0);
</script></body></html>
