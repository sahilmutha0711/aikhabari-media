<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:Ser;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:Mono;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Regular.ttf')}
@font-face{font-family:Mono;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/IBMPlexMono-Bold.ttf')}
@font-face{font-family:Sans;font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
:root{--ink:#07080C;--ink2:#14161C;--cream:#FFFFFF;--acc:#00E5FF;--red:#FF3D6E;--dim:#A3A7B5}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:Sans;color:var(--cream)}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.abs{position:absolute}
.disp{font-family:Disp;line-height:1.0;letter-spacing:0;text-transform:uppercase}
.ser{font-family:Ser;line-height:1.05}
.mono{font-family:Mono}
#grain{position:absolute;inset:-50px;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#brand{position:absolute;left:64px;top:92px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:4px}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--acc)}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font-family:Sans;font-weight:700;font-size:64px;line-height:1.15}
#cap span{padding:2px 12px;border-radius:10px;margin:0 2px;display:inline-block}
.win{border-radius:24px;background:#1A1A1A;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.07)}
.bar{height:70px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:2px solid rgba(255,255,255,.07)}
.dot{width:18px;height:18px;border-radius:50%}
.chip{display:inline-block;padding:14px 32px;border-radius:60px;font-family:Mono;font-weight:700;font-size:32px;letter-spacing:2px}
.tag{font-family:Mono;font-size:20px;letter-spacing:3px;color:var(--dim);border:1px solid #444;padding:4px 10px;border-radius:6px}
</style></head><body>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:.01"><img src="__OWLDIR__/closeup.png"><img src="__OWLDIR__/point.png"><img src="__DIR__/hq.jpg"><img src="__DIR__/room.jpg"><img src="__DIR__/cctv.jpg"><img src="__DIR__/court.jpg"></div>
<div id="cam"><div id="stage"></div></div>
<svg id="grain" width="1180" height="2020"><filter id="n"><feTurbulence id="tb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig"></div><div id="prog"></div><div id="brand"></div><div id="cap"></div>
<script>
const WD=__WORDS__,TOTAL=__TOTAL__,D='__DIR__',K='__OWLDIR__';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const nm=s=>s.toLowerCase().replace(/[^a-z0-9$']/g,'');
const L=[];WD.forEach(w=>{if(L[w.line]===undefined)L[w.line]=w.s});L.push(TOTAL);
function W(word,line,k=0){const c=WD.filter(w=>w.line===line&&nm(w.w)===nm(word));return c.length?c[Math.min(k,c.length-1)].s:L[line]}
const P=(t,t0,d=.35)=>eo((t-t0)/d), B=(t,t0,d=.45)=>eb((t-t0)/d);
function typed(str,t,t0,cps=38){const n=Math.floor(cl((t-t0)*cps,0,str.length));return str.slice(0,n)+(t>t0&&n<str.length&&Math.floor(t*4)%2?'▍':'')}
function rise(t,t0,dy=60){const p=P(t,t0,.4);return `opacity:${p};transform:translateY(${(1-p)*dy}px)`}
function pop(t,t0){const p=B(t,t0,.45);return `opacity:${cl((t-t0)/.12)};transform:scale(${.6+.4*p})`}
const PAL={sun:['#FF4D2E','#FF2E63','#FF9500','#FF6F91'],sea:['#0047E0','#00D4FF','#0020A0','#00F0C0'],neon:['#07080C','rgba(0,229,255,.38)','rgba(255,61,110,.38)','rgba(0,87,255,.35)'],alert:['#D10028','#FF3D6E','#FF6A00','#8A0018']};
function MESH(t,k){const c=PAL[k],a=t*.35;const g=(i,x,y,r)=>`radial-gradient(${r}px ${r}px at ${x}% ${y}%,${c[i]},transparent 70%)`;
 return `<div class=abs style="inset:0;background:${g(1,30+20*Math.sin(a),25+15*Math.cos(a*1.3),900)},${g(2,75+15*Math.cos(a*.9),70+15*Math.sin(a*1.1),1000)},${g(3,50+30*Math.sin(a*.7+2),95+10*Math.cos(a),800)},${c[0]}"></div>`}
const DUO=(o=.85,a='#FF3D6E',b='#FF8A00')=>`<div class=abs style="inset:0;background:linear-gradient(160deg,${a},${b});mix-blend-mode:color;opacity:${o}"></div>`;
const pad=n=>String(n).padStart(2,'0');
function stamp(t,d){const s=Math.floor(t*10)%600;return `${d} 0${Math.floor(9+t/60)}:${pad(14+Math.floor(t/60))}:${pad(Math.floor(t)%60)}`}
const S=[];
// 0 HOOK — CCTV of OpenAI HQ
S[0]=(t)=>{const rec=Math.floor(t*2)%2;
 return `<div class=abs style="inset:-40px;background:url(${D}/hq.jpg) center/cover;filter:grayscale(1) contrast(1.25) brightness(.55);transform:scale(${1.08+t*.012})"></div>
 ${DUO(.9)}<div class=abs style="inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px)"></div>
 <div class="abs mono" style="left:64px;top:170px;font-size:28px;font-weight:700;color:#fff">${rec?'&#9679;':'&nbsp;'} REC</div>
 <div class="abs mono" style="right:64px;top:170px;font-size:26px;color:var(--cream)">CAM 04 &middot; SAN FRANCISCO</div>
 <div class="abs disp" style="left:0;right:0;top:250px;text-align:center;font-size:250px;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.6);${pop(t,0)}">OPENAI</div>
 <div class=abs style="left:0;right:0;top:820px;height:1100px;background:linear-gradient(180deg,transparent,rgba(7,8,12,.88) 30%,var(--ink) 55%)"></div>
 <div class="abs disp" style="left:64px;right:64px;top:930px;font-size:92px;${rise(t,W('hidden',0))}">found a <span style="color:var(--acc)">hidden recorder</span> in its exec meeting room</div>
 <div class="abs ser" style="left:64px;right:64px;top:1200px;font-size:64px;${rise(t,W('own',0))}">and its own AI helped catch who planted it</div>
 <div class="abs disp" style="right:64px;top:1340px;font-size:70px;padding:4px 28px;border:6px solid var(--red);color:var(--red);transform-origin:right;rotate:-6deg;${pop(t,W('planted',0))}">BUGGED</div>`};
// 1 HOST (light)
S[1]=(t)=>`${MESH(t,'sun')}
 <div class=abs style="left:290px;top:${330+Math.sin(t*3)*10}px;width:500px;height:500px;background:url(${K}/closeup.png) center/contain no-repeat;${pop(t,L[1])}"></div>
 <div class="abs mono" style="left:0;right:0;top:880px;text-align:center;font-size:30px;letter-spacing:6px;color:#fff;font-weight:700;${rise(t,L[1]+.2)}">YOUR AI NEWS HOST</div>
 <div class="abs disp" style="left:0;right:0;top:930px;text-align:center;font-size:130px;color:#fff;${rise(t,L[1]+.35)}">The AI Khabari</div>
 <div class="abs ser" style="left:0;right:0;top:1110px;text-align:center;font-size:80px;color:#fff;${rise(t,W('real',1))}">this is <span style="background:#07080C;color:#fff;padding:0 14px">real.</span></div>`;
// 2 DISCOVERY — sweep behind the TV (illustration)
S[2]=(t)=>{const tv=W('tv',2),usb=W('usb',2),tp=W('toilet',2),slide=P(t,tv+.2,.7);
 const sweepX=540+Math.sin(t*2.2)*330,ring=((t*1.4)%1);
 return `<div class=abs style="inset:-40px;background:url(${D}/room.jpg) center/cover;filter:blur(10px) brightness(.3);transform:scale(1.1)"></div>${MESH(t,'neon').replace('#07080C"','transparent"')}
 <div class="abs mono" style="left:64px;top:220px;font-size:34px;color:var(--acc);font-weight:700">${typed('SEP 30 · SECURITY SWEEP',t,L[2],30)}</div>
 <div class="abs tag" style="right:64px;top:226px">ILLUSTRATION</div>
 <div class=abs style="left:90px;right:90px;top:420px;height:620px;border-radius:20px;background:#0C0C0C;border:6px solid #2A2A2A;transform:translateX(${-slide*520}px) rotate(${-slide*4}deg);box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:2">
  <div class="abs disp" style="inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;color:#333">MEETING ROOM TV</div></div>
 <div class=abs style="left:90px;right:90px;top:420px;height:620px;border-radius:20px;background:#232323;border:2px dashed #3A3A3A">
  <div class=abs style="left:360px;top:250px;width:180px;height:110px;border-radius:12px;background:#3A3A3A;border:4px solid #555"><div class="mono abs" style="left:0;right:0;top:-44px;text-align:center;font-size:26px;color:var(--dim)">USB PORT</div></div>
  <div class=abs style="left:390px;top:290px;width:220px;height:110px;border-radius:40px;background:repeating-linear-gradient(90deg,#F2EFE6 0 16px,#E2DED2 16px 18px);box-shadow:0 0 ${30+20*Math.sin(t*8)}px rgba(255,69,58,.8);opacity:${P(t,usb,.3)}"><div class=abs style="right:18px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--red);opacity:${Math.floor(t*3)%2}"></div></div>
 </div>
 <div class=abs style="left:${sweepX-160}px;top:${730-160}px;width:320px;height:320px;border-radius:50%;border:4px solid rgba(255,214,10,${1-ring});transform:scale(${.4+ring});z-index:3"></div>
 <div class="abs chip" style="left:64px;top:1110px;background:var(--acc);color:var(--ink);${pop(t,tv)}">BEHIND THE TV</div>
 <div class="abs chip" style="left:64px;top:1220px;border:3px solid var(--cream);${pop(t,usb)}">PLUGGED INTO USB</div>
 <div class="abs chip" style="left:64px;top:1330px;border:3px solid var(--red);color:var(--red);${pop(t,tp)}">WRAPPED IN TOILET PAPER</div>`};
// 3 INSIDER
S[3]=(t)=>`${MESH(t,'sea')}
 <div class="abs mono" style="left:64px;top:300px;font-size:30px;letter-spacing:5px;color:#CFF6FF;font-weight:700;${rise(t,L[3])}">PROSECUTORS SAY</div>
 <div class=abs style="left:64px;right:64px;top:400px;display:flex;gap:26px">${[0,1,2,3,4].map(i=>`<div style="flex:1;height:380px;border-radius:18px;background:${i==2&&t>W('own',3)?'#fff':'rgba(0,0,40,.35)'};transition:none;opacity:${P(t,L[3]+i*.1,.3)};display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px"><div style="width:70px;height:70px;border-radius:50%;background:${i==2&&t>W('own',3)?'#0047E0':'rgba(255,255,255,.25)'};position:absolute;margin-bottom:200px"></div><div style="width:120px;height:150px;border-radius:60px 60px 10px 10px;background:${i==2&&t>W('own',3)?'#0047E0':'rgba(255,255,255,.25)'}"></div></div>`).join('')}</div>
 <div class="abs disp" style="left:64px;right:64px;top:860px;font-size:130px;${pop(t,W('own',3))}">An <span style="background:#fff;color:#0047E0;padding:0 18px">insider</span></div>
 <div class="abs ser" style="left:64px;right:64px;top:1020px;font-size:70px;${rise(t,W('engineers',3))}">one of OpenAI's own engineers</div>`;
// 4 CCTV + second device
S[4]=(t)=>{const d2=W('second',4);let tiles='';
 for(let i=0;i<4;i++){tiles+=`<div style="position:relative;height:300px;border-radius:12px;overflow:hidden;border:3px solid ${i==1?'var(--red)':'#333'};opacity:${P(t,L[4]+i*.15,.3)}"><div style="position:absolute;inset:-20px;background:url(${D}/room.jpg) ${20+i*25}% center/cover;filter:grayscale(1) brightness(.6) contrast(1.3);transform:scale(${1.2+Math.sin(t+i)*.03})"></div><div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 5px)"></div><div class=mono style="position:absolute;left:14px;top:10px;font-size:20px;color:var(--cream)">CAM 0${i+1}</div>${i==1?`<div style="position:absolute;left:${120+Math.sin(t*1.5)*40}px;top:110px;width:90px;height:150px;border:3px solid var(--acc)"></div>`:''}</div>`}
 return `${MESH(t,'neon')}
 <div class=abs style="left:64px;right:64px;top:220px;display:grid;grid-template-columns:1fr 1fr;gap:16px">${tiles}</div>
 <div class="abs mono" style="left:64px;top:880px;font-size:24px;color:var(--dim)">ILLUSTRATION &middot; NOT REAL FOOTAGE</div>
 <div class=abs style="left:64px;right:64px;top:950px;padding:30px 36px;border-radius:20px;background:var(--ink2);border:3px solid var(--acc);${rise(t,d2)}">
  <div class=mono style="font-size:28px;color:var(--acc);font-weight:700">DAYS LATER</div>
  <div class=disp style="font-size:76px;margin-top:8px">A 2nd device, in a bag he left behind</div></div>`};
// 5 TWIST — chat window (illustration)
S[5]=(t)=>{const a=W('account',5),tr=W('trace',5);
 return `${MESH(t,'sun')}
 <div class="abs disp" style="left:64px;top:220px;font-size:110px;color:#fff;${pop(t,L[5])}">The twist</div>
 <div class="abs win" style="left:54px;right:54px;top:400px;height:560px;${rise(t,a-.3)}">
  <div class=bar><div class=dot style="background:#FF5F57"></div><div class=dot style="background:#FEBC2E"></div><div class=dot style="background:#28C840"></div><div class=mono style="margin-left:16px;font-size:24px;color:var(--dim)">chatbot</div><div class="tag" style="margin-left:auto">ILLUSTRATION</div></div>
  <div style="padding:40px 36px">
   <div style="margin-left:auto;max-width:720px;background:#2E2E2E;border-radius:26px 26px 6px 26px;padding:24px 30px;font-size:40px;line-height:1.3;opacity:${P(t,a,.3)}">${typed('how do I build and hide a small recorder?',t,a,32)}</div>
   <div class=mono style="margin-top:40px;font-size:26px;color:var(--dim);opacity:${P(t,a+1.4,.3)}">prompt paraphrased from the criminal complaint</div>
  </div>
  <div class="abs disp" style="left:160px;top:300px;font-size:120px;padding:0 30px;border:8px solid #fff;color:#fff;background:rgba(209,0,40,.85);rotate:-8deg;${pop(t,tr)}">TRACED</div></div>
 <div class="abs ser" style="left:64px;right:64px;top:1030px;font-size:66px;${rise(t,W('models',5))}">OpenAI: our own models helped trace him</div>`};
// 6 ARREST
S[6]=(t)=>{const y=W('five',6),v=Math.round(5*eo(cl((t-y)/.8)));
 return `<div class=abs style="inset:-40px;background:url(${D}/court.jpg) center/cover;filter:grayscale(1) brightness(.5);transform:scale(${1.1+t*.004})"></div>${DUO(.95,'#0047E0','#00B8FF')}<div class=abs style="inset:0;background:rgba(7,8,12,.35)"></div>
 <div class="abs mono" style="left:64px;top:300px;font-size:30px;letter-spacing:5px;color:var(--acc);font-weight:700;${rise(t,L[6])}">FEDERAL COURT &middot; SAN FRANCISCO</div>
 <div class="abs disp" style="left:64px;right:64px;top:370px;font-size:160px;${pop(t,W('arrested',6))}">Arrested <span style="color:var(--acc)">Oct 9</span></div>
 <div class="abs disp" style="left:64px;top:700px;font-size:420px;color:#fff;opacity:${P(t,y-.2)}">${v}</div>
 <div class="abs disp" style="left:330px;top:820px;font-size:110px;opacity:${P(t,y)}">years<br><span style="font-size:60px;color:var(--dim)">max sentence</span></div>
 <div class="abs mono" style="left:64px;right:64px;top:1240px;font-size:22px;color:var(--dim)">Photo: Phillip Burton Federal Building, Sam Wheeler / CC BY-SA 3.0</div>`};
// 7 CATCH
S[7]=(t)=>{const it=[['charged, NOT convicted','convicted'],['no code or customer data taken (OpenAI)','code']];
 let h=`${MESH(t,'alert')}
 <div class="abs disp" style="left:64px;top:330px;font-size:170px;color:#fff;${pop(t,L[7])}">The catch</div>`;
 it.forEach((x,i)=>{const t0=W(x[1],7);h+=`<div class="abs mono" style="left:64px;right:64px;top:${640+i*200}px;font-size:46px;padding:30px 34px;border-radius:18px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.6);opacity:${P(t,t0-.2,.25)}"><span style="color:#fff;font-weight:700">[!]</span> ${typed(x[0],t,t0-.2,45)}</div>`});return h};
// 8 BIG IDEA (light)
S[8]=(t)=>`${MESH(t,'sea')}
 <div class="abs disp" style="left:64px;right:64px;top:420px;font-size:150px;color:#fff;${rise(t,W('biggest',8))}">AI's biggest secrets</div>
 <div class="abs ser" style="left:64px;right:64px;top:780px;font-size:150px;color:#00F0C0;${pop(t,W('room',8))}">are in the room.</div>`;
// 9 TAKEAWAY (light)
S[9]=(t)=>{const it=[['Chats can be logged','logged'],['Chats can be traced','traced'],["Don't type what you wouldn't say in court",'court']];
 let h=`<div class=abs style="inset:0;background:linear-gradient(160deg,#F2FEFF,#B8F1FF 60%,#9FE6FF)"></div>
 <div class="abs mono" style="left:64px;top:300px;font-size:30px;letter-spacing:5px;font-weight:700;color:#0047E0;${rise(t,L[9])}">WHAT YOU CAN TAKE FROM THIS</div>`;
 it.forEach((x,i)=>{const t0=W(x[1],9),c=P(t,t0,.25);h+=`<div class=abs style="left:64px;right:64px;top:${420+i*230}px;display:flex;align-items:center;gap:34px;color:var(--ink);${rise(t,t0-.3,40)}">
  <div style="flex:none;width:96px;height:96px;border-radius:20px;border:5px solid var(--ink);background:${c>.5?'var(--acc)':'transparent'};display:flex;align-items:center;justify-content:center;font-family:Mono;font-weight:700;font-size:60px;transform:scale(${1+Math.sin(cl((t-t0)/.3)*Math.PI)*.15})">${c>.5?'<svg width=60 height=60 viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill=none stroke="#111" stroke-width=3.4 stroke-linecap=round stroke-linejoin=round/></svg>':''}</div>
  <div class=disp style="font-size:${x[0].length>24?62:78}px">${x[0]}</div></div>`});return h};
// 10 CTA
S[10]=(t)=>`${MESH(t,'neon')}
 <div class="abs disp" style="left:64px;right:64px;top:300px;font-size:110px;${rise(t,L[10])}">Would you trust a company that checks chats</div>
 <div class="abs ser" style="left:64px;right:64px;top:690px;font-size:130px;color:var(--acc);${rise(t,W('spy',10))}">to catch a spy?</div>
 <div class="abs chip" style="left:64px;top:900px;background:var(--acc);color:var(--ink);${pop(t,W('send',10))}">SEND TO A FRIEND IN TECH</div>
 <div class="abs chip" style="left:64px;top:1020px;border:3px solid var(--cream);${pop(t,W('tech',10))}">FOLLOW @THEAIKHABARI</div>
 <div class=abs style="right:30px;top:${1060+Math.sin(t*3)*12}px;width:400px;height:400px;background:url(${K}/point.png) center/contain no-repeat;transform:scaleX(-1);opacity:${P(t,L[10]+.3,.4)}"></div>
 <div class="abs mono" style="left:64px;right:64px;top:1800px;font-size:20px;color:var(--dim)">Sources: AP/ABC7, Fox Business, SF Standard (Oct 13-14, 2026). The accused has not been convicted. Room, CCTV and chat scenes are illustrations.</div>`;
const LIGHT=new Set([9]);
function setT(t){
 let i=0;for(let k=0;k<S.length;k++)if(t>=L[k]-.12)i=k;
 const lt=t-(L[i]-.12),inP=eo(lt/.28);
 document.getElementById('stage').innerHTML=`<div class=abs style="inset:0;transform:translateX(${(1-inP)*140}px);filter:blur(${(1-inP)*14}px)">${S[i](t,lt)}</div>`;
 const beats=[W('planted',0),W('trace',5),W('five',6)];let pz=0;beats.forEach(b=>{if(t>b&&t<b+.5)pz=Math.max(pz,(1-(t-b)/.5)*.05)});
 document.getElementById('cam').style.transform=`scale(${1+pz+Math.sin(t*.7)*.004}) rotate(${pz*8*Math.sin(t*40)}deg)`;
 document.getElementById('tb').setAttribute('seed',Math.floor(t*24)%97+1);
 document.getElementById('grain').style.transform=`translate(${(t*137)%40-20}px,${(t*91)%40-20}px)`;
 document.getElementById('prog').style.width=(t/TOTAL*100)+'%';
 const light=LIGHT.has(i),br=document.getElementById('brand');br.innerHTML=`<span style="color:${light?'#0047E0':'var(--acc)'}">&#9679;</span> THE AI KHABARI`;br.style.color=light?'var(--ink)':'var(--cream)';
 document.getElementById('prog').style.background=light?'#0047E0':'#fff';
 const cur=WD.findIndex(w=>t>=w.s&&t<w.e+.05);const cap=document.getElementById('cap');
 if(cur<0||t<0.05){cap.innerHTML='';return}
