<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:Disp;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/BricolageGrotesque-Bold.ttf')}
@font-face{font-family:Mono;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/JetBrainsMono-Bold.ttf')}
@font-face{font-family:Body;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Disp;color:#fff}
#st{position:absolute;inset:0;clip-path:inset(0 0 2px 0)}
.ab{position:absolute}.c{position:absolute;left:0;right:0;text-align:center}
.H{text-transform:uppercase;letter-spacing:-2px;line-height:.95;text-shadow:0 6px 30px rgba(0,0,0,.75)}
.pill{display:inline-block;font-family:Mono;letter-spacing:4px;border-radius:70px;white-space:nowrap}
.chip{display:inline-block;font-family:Mono;border-radius:60px;white-space:nowrap}
#cap{position:absolute;left:40px;right:40px;top:1530px;text-align:center;font-size:66px;line-height:1.1;text-transform:uppercase;font-family:Disp}
#cap b{padding:2px 16px;border-radius:44px;-webkit-text-stroke:0;font-weight:normal}
</style></head><body><div id=st></div><script>
const A='#60A5FA',Bc='#FDBA74',BG='#0B1120',INK='#0B1120',CARD='rgba(11,17,32,.88)';
const W0=__WORDS__;
// fix ASR: "Jens and Huang." -> "Jensen Huang."; "9 %" -> "9%"
let W=[];for(let i=0;i<W0.length;i++){const w=W0[i];
 if(w.w=='Jens'&&W0[i+1]&&W0[i+1].w=='and'){W.push({w:'Jensen',s:w.s,e:w.e});continue}
 if(w.w=='and'&&W0[i-1]&&W0[i-1].w=='Jens')continue;
 if(w.w=='9'&&W0[i+1]&&W0[i+1].w=='%'){W.push({w:'9%',s:w.s,e:W0[i+1].e});i++;continue}
 W.push(w)}
// caption chunks: <=3 words, break after punctuation
const CH=[];let cur=[];W.forEach(w=>{cur.push(w);if(cur.length==3||/[.,?!]$/.test(w.w)){CH.push(cur);cur=[]}});if(cur.length)CH.push(cur);
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const lin=(t,t0,d)=>cl((t-t0)/d,0,1);
const eo=x=>1-Math.pow(1-x,3);
const bk=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(t,t0,d=.35)=>{const x=lin(t,t0,d);return x<=0?0:bk(x)};
const op=(t,t0,d=.25)=>eo(lin(t,t0,d));
const rise=(t,t0,px=40,d=.4)=>`opacity:${op(t,t0,d)};transform:translateY(${(1-eo(lin(t,t0,d)))*px}px)`;
const sp=(t,t0,d)=>`opacity:${op(t,t0,.2)};transform:scale(${pop(t,t0,d)})`;
function chip(txt,bg,fg,fs=40,pad='12px 26px',extra=''){return `<span class=chip style="background:${bg};color:${fg};font-size:${fs}px;padding:${pad};${extra}">${txt}</span>`}
function cap(t){
 if(t<0.02)return '';
 let k=-1;for(let i=0;i<CH.length;i++)if(CH[i][0].s<=t+0.05)k=i;
 if(k<0)return '';const c=CH[k];const end=(CH[k+1]?CH[k+1][0].s:99);if(t>c[c.length-1].e+0.6&&t<end)return '';
 return `<div id=cap><span style="display:inline-block;background:rgba(11,17,32,.72);border-radius:60px;padding:10px 22px;-webkit-text-stroke:0">${c.map(w=>{const on=w.s<=t+0.05&&t<(w.e+0.15);return on?`<b style="background:${Bc};color:${INK}">${w.w}</b>`:w.w}).join(' ')}</span></div>`}
const scrim=`<div class=ab style="inset:0;background:linear-gradient(180deg,${BG}F2 0%,${BG}99 24%,${BG}00 42%,${BG}00 62%,${BG}CC 80%,${BG}F5 100%)"></div>`;
// deterministic candles
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const CAN=[];let p=50;for(let i=0;i<34;i++){const o=p;p=cl(p+(rnd()-.42)*14,10,95);CAN.push([o,p,Math.max(o,p)+rnd()*6,Math.min(o,p)-rnd()*6])}
function candles(t,t0,x,y,w,h,alpha=1){
 const n=Math.floor(lin(t,t0,1.6)*CAN.length);let s='';const cw=w/CAN.length;
 for(let i=0;i<n;i++){const [o,c,hi,lo]=CAN[i];const col=c>=o?A:Bc;const yy=v=>h-(v/100)*h;
  s+=`<line x1=${i*cw+cw/2} x2=${i*cw+cw/2} y1=${yy(hi)} y2=${yy(lo)} stroke="${col}" stroke-width=3 />`+
     `<rect x=${i*cw+3} width=${cw-6} y=${Math.min(yy(o),yy(c))} height=${Math.max(4,Math.abs(yy(o)-yy(c)))} rx=4 fill="${col}"/>`}
 return `<svg class=ab style="left:${x}px;top:${y}px;opacity:${alpha}" width=${w} height=${h}>${s}</svg>`}
function bell(t,sz=46,col=INK){const a=Math.sin(t*14)*18;return `<svg width=${sz} height=${sz} viewBox="0 0 24 24" style="vertical-align:-8px;transform:rotate(${a}deg);transform-origin:50% 10%"><path fill="${col}" d="M12 2a1.5 1.5 0 0 1 1.5 1.5v.6A6.5 6.5 0 0 1 18.5 10.5v4l2 2.5v1H3.5v-1l2-2.5v-4A6.5 6.5 0 0 1 10.5 4.1v-.6A1.5 1.5 0 0 1 12 2zm-2.2 17.5h4.4a2.2 2.2 0 0 1-4.4 0z"/></svg>`}
const CR=[[7.3,'PHOTO: COOLCAESAR · CC BY-SA 4.0'],[9.88,'PHOTO: ANDERS EIDESVIK · CC BY 4.0'],[11.9,'PHOTO: NIELSONCAETANOSALMERON · CC BY 4.0'],[14.8,'PHOTO: WILL BUCKNER · CC BY 2.0'],[16.15,'PHOTO: COOLCAESAR · CC BY-SA 4.0'],[16.95,'PHOTO: COOLCAESAR · CC BY-SA 4.0'],[17.5,'PHOTO: THINGREENLINE4546 · CC BY-SA 4.0'],[18.02,'PHOTO: 4300STREETCAR · CC BY 4.0'],[19.55,'VIDEO: ZDF/TERRA X · CC BY 4.0'],[22.05,"PHOTO: LUCA MARFÈ · CC BY 2.0"],[24.4,'PHOTO: JOE MABEL · CC BY-SA 4.0'],[26.35,'PHOTO: DIETMAR RABICH · CC BY-SA 4.0']];
function setT(t){let h='';
 // ---------- FACE 1 (0-7.3): top strip only (y 260-360), never over head ----------
 if(t<7.3){
  if(t<3.8){const tk=[['AMZN',.84],['GOOGL',1.52],['NVDA',2.08],['AMD',2.64]];
   h+=`<div class=c style="top:${t<0.04?150:262}px">${tk.map(([k,s])=>{const on=t>=s-0.05;const act=on&&t<s+0.7;
    return `<span style="display:inline-block;margin:0 7px;transform:scale(${on?(act?1+0.12*Math.sin(lin(t,s,.5)*Math.PI):1):0.92})">${chip(k,on?(act?Bc:A):CARD,on?INK:'#fff',44,'14px 26px',on?'':`border:3px solid ${A}`)}</span>`}).join('')}</div>`;
   if(t<0.04)h+=`<div class="c H" style="top:270px;font-size:64px">THE 4 STOCKS TO WATCH</div>`;}
  else if(t<6.4){h+=`<div class=c style="top:262px;${rise(t,3.8,30)}">${chip('WATCH',CARD,'#fff',42,'14px 26px',`border:3px solid ${A}`)} ${chip('TUESDAY',A,INK,48,'12px 30px',`transform:scale(${t>=5.1?pop(t,5.1):0.9});display:inline-block`)} ${chip('&amp; THURSDAY',Bc,INK,48,'12px 30px',`opacity:${op(t,5.3)};display:inline-block`)}</div>`}
  else h+=`<div class=c style="top:262px;${sp(t,6.45,.35)}">${chip('HERE\'S WHY ↓',Bc,INK,52,'12px 36px')}</div>`;
 }
 // ---------- B-ROLL (7.3-29.05) ----------
 else if(t<29.05){h+=scrim;
  if(t<9.88){ // Nvidia earnings
   h+=`<div class=c style="top:280px;${rise(t,7.4)}"><span class=pill style="background:${A};color:${INK};font-size:34px;padding:14px 34px">THIS TUESDAY</span></div>`;
   h+=`<div class="c H" style="top:380px;font-size:120px;${rise(t,8.1,50)}">NVIDIA<br><span style="color:${Bc}">EARNINGS</span></div>`;
   h+=`<div class=c style="top:650px;${sp(t,8.2)}">${chip('NVDA',CARD,'#fff',52,'14px 34px',`border:4px solid ${A}`)}</div>`;
   h+=candles(t,8.4,90,1180,900,260,.95);
  } else if(t<11.9){ // first without Jensen
   h+=`<div class=c style="top:280px;${rise(t,9.95)}"><span class=pill style="background:${Bc};color:${INK};font-size:34px;padding:14px 34px">FIRST EVER</span></div>`;
   h+=`<div class="c H" style="top:1180px;font-size:96px;${rise(t,10.5,50)}">WITHOUT<br><span style="background:${A};color:${INK};padding:0 24px;border-radius:80px;text-shadow:none">JENSEN HUANG</span></div>`;
  } else if(t<14.8){ // 9% swing gauge
   h+=`<div class=ab style="inset:0;background:${BG}A6"></div>`;
   h+=`<div class=c style="top:280px;${rise(t,11.95)}"><span class=pill style="background:${A};color:${INK};font-size:32px;padding:14px 30px">OPTION TRADERS BET ON A</span></div>`;
   const ang=t<13.6?-80+lin(t,12.2,1.3)*0:70*Math.sin((t-13.6)*5)*Math.exp(-(t-13.6)*0.15);
   const nv=t<13.6?-80+160*eo(lin(t,12.2,1.4)):ang;
   h+=`<svg class=ab style="left:140px;top:430px;${sp(t,12.1,.4)}" width=800 height=500>
    <path d="M90 440 A310 310 0 0 1 710 440" stroke="${BG}CC" stroke-width=70 fill=none stroke-linecap=round />
    <path d="M90 440 A310 310 0 0 1 400 130" stroke="${Bc}" stroke-width=54 fill=none stroke-linecap=round />
    <path d="M400 130 A310 310 0 0 1 710 440" stroke="${A}" stroke-width=54 fill=none stroke-linecap=round />
    <g transform="rotate(${nv} 400 440)"><line x1=400 y1=440 x2=400 y2=180 stroke="#fff" stroke-width=14 stroke-linecap=round /></g>
    <circle cx=400 cy=440 r=30 fill="#fff"/>
    <text x=60 y=500 font-family=Mono font-size=44 fill="${Bc}">−9%</text><text x=740 y=500 text-anchor=end font-family=Mono font-size=44 fill="${A}">+9%</text></svg>`;
   h+=`<div class="c H" style="top:960px;font-size:190px;${sp(t,13.6,.4)}"><span style="color:${Bc}">±</span>9%</div>`;
   h+=`<div class="c H" style="top:1160px;font-size:80px;${rise(t,14.0)}">SWING</div>`;
  } else if(t<19.55){ // the chain
   const L=[['NVDA','NVIDIA',14.98],['AMD','AMD',16.2],['AVGO','BROADCOM',16.98],['MU','MICRON',17.52],['TSM','TSMC',18.04]];
   h+=`<div class="c H" style="top:280px;font-size:72px;${rise(t,14.85)}">WHEN <span style="color:${A}">NVIDIA</span> MOVES…</div>`;
   h+=`<div class=c style="top:380px">${L.slice(1).map(([k,n,s])=>`<span style="display:inline-block;margin:0 6px;${sp(t,s,.3)}">${chip(k,A,INK,40,'12px 24px')}</span>`).join('')}</div>`;
   let k=0;L.forEach((x,i)=>{if(t>=x[2]-0.1)k=i});const [tk,nm,s0]=L[k];
   h+=`<div class=c style="top:1150px;${sp(t,s0-0.1,.3)}"><div style="display:inline-flex;align-items:center;gap:26px;background:${CARD};border:5px solid ${k?Bc:A};border-radius:120px;padding:22px 52px 22px 22px">
     <span style="width:150px;height:150px;border-radius:50%;background:${k?Bc:A};color:${INK};display:flex;align-items:center;justify-content:center;font-family:Mono;font-size:${tk.length>3?40:50}px">${tk}</span>
     <span style="font-size:84px;letter-spacing:-1px">${nm}</span></div></div>`;
   if(t>18.35)h+=`<div class="c H" style="top:1360px;font-size:58px;${rise(t,18.4)}">…THEY MOVE WITH IT <span style="color:${Bc};display:inline-block;transform:translateY(${Math.sin(t*9)*10}px)">⇅</span></div>`;
  } else if(t<22.05){ // Anthropic IPO
   h+=`<div class=c style="top:280px;${rise(t,19.6)}"><span class=pill style="background:${Bc};color:${INK};font-size:34px;padding:14px 34px">THIS THURSDAY</span></div>`;
   h+=`<div class="c H" style="top:400px;font-size:124px;${rise(t,20.4,50)}">ANTHROPIC</div>`;
   h+=`<div class="c H" style="top:540px;font-size:96px;${rise(t,20.9,40)}">GOES <span style="background:${A};color:${INK};padding:0 26px;border-radius:80px;text-shadow:none">PUBLIC</span></div>`;
   const r=(t*0.9)%1;h+=`<div class=ab style="left:${540-160-r*120}px;top:${960-r*120}px;width:${320+r*240}px;height:${320+r*240}px;border-radius:50%;border:6px solid ${A};opacity:${(1-r)*op(t,21)}"></div>
   <div class=ab style="left:390px;top:810px;width:300px;height:300px;border-radius:50%;background:${CARD};border:6px solid ${Bc};display:flex;align-items:center;justify-content:center;font-size:110px;${sp(t,21.0)}">IPO</div>`;
  } else if(t<24.4){ // 6x orders
   h+=`<div class=ab style="inset:0;background:${BG}A6"></div>`;
   h+=`<div class="c H" style="top:280px;font-size:100px;${rise(t,22.1)}">ORDERS CAME IN</div>`;
   const m=1+5*eo(lin(t,22.5,1.0));
   h+=`<div class="c H" style="top:400px;font-size:230px;color:${Bc};${sp(t,22.5,.35)}">${m.toFixed(0)}×</div>`;
   h+=`<div class=ab style="left:110px;top:760px;width:860px">
     <div style="font-family:Mono;font-size:34px;margin-bottom:12px;${rise(t,22.6,20)}">SHARES ON OFFER</div>
     <div style="height:80px;width:${860/6*eo(lin(t,22.6,.3))}px;border-radius:40px;background:${A}"></div>
     <div style="font-family:Mono;font-size:34px;margin:34px 0 12px;${rise(t,22.8,20)}">ORDERS</div>
     <div style="height:80px;width:${860*eo(lin(t,22.8,1.0))}px;border-radius:40px;background:${Bc}"></div></div>`;
   h+=`<div class="c H" style="top:1130px;font-size:72px;${rise(t,23.6)}">BIGGER THAN SUPPLY</div>`;
  } else { // the link: Amazon & Google
   if(t>25.8)h+=`<div class=ab style="inset:0;background:${BG}A6"></div>`;
   h+=`<div class=c style="top:280px;${rise(t,24.75)}"><span class=pill style="background:${A};color:${INK};font-size:36px;padding:14px 36px">🔗 THE MAJOR LINK</span></div>`;
   const C=(x,k,col,s)=>`<div class=ab style="left:${x}px;top:470px;width:420px;height:420px;border-radius:50%;background:${CARD};border:7px solid ${col};display:flex;flex-direction:column;align-items:center;justify-content:center;${sp(t,s,.35)}">
     <div style="font-family:Mono;font-size:56px">${k}</div><div style="font-size:${t>=27.3?92:0}px;color:${col};${sp(t,27.36,.35)}">$${Math.round(100*eo(lin(t,27.36,.7)))}B+</div></div>`;
   h+=C(95,'AMZN',A,25.9)+C(565,'GOOGL',Bc,26.4);
   h+=`<div class=c style="top:960px;${rise(t,27.6)}"><span style="display:inline-block;background:${CARD};border:4px solid ${A};border-radius:80px;padding:18px 40px;font-size:56px;text-transform:uppercase">STAKE IN ANTHROPIC · <span style="color:${Bc}">EACH</span></span></div>`;
  }
 }
 // ---------- FACE 2 (29.05-end): top strip only ----------
 else {
  if(t<32.85){const L=[['CUSTOMERS',30.5,A],['SUPPLIERS',31.22,Bc],['INVESTORS',32.24,A]];
   h+=`<div class=c style="top:268px">${chip('IN AI:',CARD,'#fff',34,'12px 20px',`border:3px solid ${A};opacity:${op(t,29.6)}`)} ${L.map(([k,s,c])=>`<span style="display:inline-block;margin:0 3px;${sp(t,s,.3)}">${chip(k,c,INK,36,'12px 20px')}</span>`).join('')}</div>`}
  else if(t<33.9)h+=`<div class=c style="top:262px;${sp(t,32.9,.35)}">${chip('= THE SAME COMPANIES',Bc,INK,50,'12px 36px')}</div>`;
  else if(t<36.25){h+=`<div class=c style="top:262px">${chip('RISE TOGETHER ↑',A,INK,44,'12px 28px',`display:inline-block;${sp(t,34.1,.3)}`)} ${chip('FALL TOGETHER ↓',Bc,INK,44,'12px 28px',`display:inline-block;${sp(t,35.4,.3)}`)}</div>`}
  else if(t<37.95)h+=`<div class=c style="top:262px;${sp(t,36.3,.35)}">${chip('FOLLOW @THEAIKHABARI',A,INK,48,'12px 36px')}</div>`;
  else h+=`<div class=c style="top:262px;${sp(t,38.0,.35)}">${chip(bell(t)+' TUE &amp; THU · AFTER THE BELL',Bc,INK,44,'12px 32px')}</div>`;
 }
 if(t>=7.3&&t<29.05){let c='';CR.forEach(x=>{if(t>=x[0])c=x[1]});h+=`<div class=ab style="right:36px;top:1470px;font-family:Mono;font-size:17px;color:rgba(255,255,255,.65)">${c}</div>`}
 h+=cap(t);document.getElementById('st').innerHTML=h}
setT(0);
</script></body></html>
